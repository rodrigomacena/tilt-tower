<title>Tilt Tower</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Inline&family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-screen portrait pinball canvas; DOM screens (title, map, workshop, pause, results) float over an attract-mode table */
:root{
  --bg:#0b0604; --wood:#4a2a12; --wood2:#2a1608; --brass:#e0b062; --cream:#f3e6c4; --amber:#ffb347; --red:#d9443a; --teal:#6fc7b8;
  --ink:#f6ecd4; --mute:#cdb68a; --panel:rgba(24,12,5,.94); --line:#6a4a26;
  --f-display:"Bungee", "Impact", system-ui, sans-serif;
  --f-inline:"Bungee Inline", "Bungee", "Impact", sans-serif;
  --f-body:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--f-body);font-size:16px}
#app{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:16px;overflow-y:auto;
  padding:28px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 80% at 50% 20%, rgba(20,10,4,.35), rgba(8,4,2,.82));touch-action:pan-y}
.screen.center{justify-content:center}
.logo{font-family:var(--f-inline);font-weight:400;font-size:clamp(56px,17vw,96px);line-height:.9;text-align:center;margin:0;color:var(--amber);
  text-shadow:0 0 22px rgba(255,179,71,.55),0 0 2px #fff4d0,5px 5px 0 #8a2a12}
.logo span{display:block;color:var(--cream);text-shadow:0 0 18px rgba(255,220,170,.5),5px 5px 0 #2a6a60}
.era{font-family:var(--f-display);font-size:14px;letter-spacing:.12em;color:var(--teal);text-align:center}
.hint{max-width:34ch;text-align:center;color:var(--mute);font-size:14px;line-height:1.45;margin:0}
.btn{font-family:var(--f-display);font-size:18px;letter-spacing:.03em;color:#2a1408;background:linear-gradient(180deg,#ffe3a6,#e8a94a 55%,#c07a26);
  border:0;border-radius:14px;padding:14px 26px;min-width:230px;cursor:pointer;box-shadow:0 2px 0 #fff3 inset,0 -3px 0 #0003 inset,0 6px 18px rgba(0,0,0,.45),0 0 24px rgba(255,170,70,.25)}
.btn:active{transform:translateY(2px)}
.btn:focus-visible,.ghost:focus-visible,.node:focus-visible,.buy:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.btn.alt{background:linear-gradient(180deg,#3c2412,#24130a);color:var(--cream);box-shadow:0 0 0 1px var(--line) inset,0 6px 18px rgba(0,0,0,.45)}
.ghost{font-family:var(--f-body);font-weight:600;font-size:14px;color:var(--cream);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.col{display:flex;flex-direction:column;gap:12px;align-items:center}
.bar{width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;text-align:center}
.wallet{font-family:var(--f-display);font-size:15px;color:var(--amber);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.wallet i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff0c0,#d8a64a 60%,#7a4a12);display:inline-block}
.tower{width:100%;max-width:460px;display:flex;flex-direction:column-reverse;gap:8px}
.node{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;
  background:linear-gradient(180deg,#2e1a0c,#1c0f06);border:1px solid var(--line);border-radius:14px;padding:10px 14px;color:var(--ink);cursor:pointer;font-family:var(--f-body)}
.node em{font-style:normal;font-family:var(--f-display);font-size:22px;color:var(--amber);text-align:center}
.node b{display:block;font-size:15px}
.node small{display:block;font-size:12px;color:var(--mute);letter-spacing:.06em}
.node small.md{font-size:11px;font-weight:700}
.node small.m1{color:#d8955a}.node small.m2{color:#dfe4f0}.node small.m3{color:#ffd860}
.node .st{font-size:16px;letter-spacing:2px;color:#5a4028}
.node .st b{display:inline;color:var(--amber)}
.node.sb{border-color:#a0582a;background:linear-gradient(180deg,#3a1c0c,#1f0e05)}
.node.boss{border-color:var(--red);background:linear-gradient(180deg,#4a160c,#200805);box-shadow:0 0 18px rgba(217,68,58,.25)}
.node[disabled]{opacity:.38;cursor:default}
.locked{width:100%;max-width:460px;border:1px dashed var(--line);border-radius:14px;padding:12px 14px;color:var(--mute);font-size:13px;text-align:center}
.shop{width:100%;max-width:460px;display:flex;flex-direction:column;gap:10px}
.up{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:linear-gradient(180deg,#2e1a0c,#1c0f06);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.up b{font-weight:700}
.up span{grid-column:1;font-size:13px;color:var(--mute)}
.pips{grid-column:1;display:flex;gap:4px}
.pips i{width:20px;height:6px;border-radius:3px;background:#4a3420}
.pips i.on{background:var(--amber);box-shadow:0 0 8px rgba(255,179,71,.6)}
.buy{grid-column:2;grid-row:1 / span 3;font-family:var(--f-display);font-size:13px;border:0;border-radius:999px;padding:9px 14px;color:#2a1408;background:var(--amber);cursor:pointer;white-space:nowrap}
.buy[disabled]{background:#4a3420;color:#9a8460;cursor:default}
.part{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;border:1px dashed var(--line);border-radius:14px;padding:10px 14px}
.part i{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff4c8,#e0b062 55%,#6a4210);box-shadow:0 0 16px rgba(224,176,98,.5)}
.part.off i{filter:grayscale(1) brightness(.4);box-shadow:none}
.part span{font-size:13px;color:var(--mute)}
.res h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0;text-align:center;color:var(--amber);text-shadow:0 0 18px rgba(255,179,71,.5)}
.stars{font-size:44px;letter-spacing:8px;color:#4a3420;text-align:center}
.stars b{color:var(--amber);text-shadow:0 0 16px rgba(255,179,71,.8);display:inline-block;animation:pop .4s both}
.stars b:nth-child(2){animation-delay:.25s}.stars b:nth-child(3){animation-delay:.5s}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.stats{display:grid;grid-template-columns:auto auto;gap:6px 18px;font-size:15px}
.stats span{color:var(--mute)}
.stats b{text-align:right;font-variant-numeric:tabular-nums}
.stats b.m1{color:#d8955a}.stats b.m2{color:#dfe4f0}.stats b.m3{color:#ffd860}
.note{max-width:36ch;text-align:center;font-size:14px;color:var(--cream);background:rgba(224,176,98,.12);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0}
#pauseBtn{position:absolute;top:8px;right:max(8px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(20,10,4,.7);color:var(--cream);font-family:var(--f-display);font-size:14px;cursor:pointer;z-index:2}
@media (prefers-reduced-motion: reduce){.stars b{animation:none}}
</style>

<div id="app">
  <canvas id="game" aria-label="Mesa de pinball do Tilt Tower"></canvas>
  <button id="pauseBtn" hidden aria-label="Pausar">II</button>

  <section class="screen center" id="s-title">
    <h1 class="logo">Tilt<span>Tower</span></h1>
    <div class="era">ERA 1 · ANOS 60</div>
    <div class="col">
      <button class="btn" id="b-play">Jogar</button>
      <button class="btn alt" id="b-shop">Oficina do Pino</button>
      <button class="ghost" id="b-sound">Som: ligado</button>
      <button class="ghost" id="b-music">Música: ligada</button>
    </div>
    <p class="hint">Toque na metade esquerda ou direita da tela para usar os flippers. O Pino é a bola: mande ele pelas rampas até o topo da torre.</p>
  </section>

  <section class="screen" id="s-map" hidden>
    <div class="bar"><button class="ghost" id="m-back">Voltar</button><h2>Era 1 · Anos 60</h2><span class="wallet"><i></i><span id="m-fichas">0</span></span></div>
    <div class="locked">Era 2 · Anos 70 · em breve</div>
    <div class="tower" id="m-list"></div>
    <button class="btn alt" id="m-shop">Oficina do Pino</button>
  </section>

  <section class="screen" id="s-shop" hidden>
    <div class="bar"><button class="ghost" id="o-back">Voltar</button><h2>Oficina do Pino</h2><span class="wallet"><i></i><span id="o-fichas">0</span></span></div>
    <div class="shop" id="o-list"></div>
    <div class="shop" id="o-parts"></div>
  </section>

  <section class="screen center" id="s-pause" hidden>
    <h2 class="logo" style="font-size:52px">Pausa</h2>
    <div class="col">
      <button class="btn" id="p-resume">Continuar</button>
      <button class="btn alt" id="p-restart">Recomeçar fase</button>
      <button class="btn alt" id="p-map">Sair para o mapa</button>
      <button class="ghost" id="p-sound">Som: ligado</button>
      <button class="ghost" id="p-music">Música: ligada</button>
    </div>
  </section>

  <section class="screen center res" id="s-result" hidden>
    <h2 id="r-title">Fase concluída</h2>
    <div class="stars" id="r-stars"></div>
    <div class="stats" id="r-stats"></div>
    <p class="note" id="r-note" hidden></p>
    <div class="col">
      <button class="btn" id="r-next">Próxima fase</button>
      <button class="btn alt" id="r-shop">Oficina do Pino</button>
      <button class="btn alt" id="r-map">Mapa</button>
    </div>
  </section>

  <section class="screen center res" id="s-over" hidden>
    <h2>Fim de jogo</h2>
    <p class="hint" id="v-text"></p>
    <div class="col">
      <button class="btn" id="v-retry">Tentar de novo</button>
      <button class="btn alt" id="v-shop">Oficina do Pino</button>
      <button class="btn alt" id="v-map">Mapa</button>
    </div>
  </section>
</div>

<script>
(() => {
'use strict';
/* =========================================================
   CONSTANTS & SAVE
   ========================================================= */
const W = 360, FH = 700, GRAV = 1000, BR = 12, TAU = Math.PI*2, STEP = 1/600;
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const rnd = i => { const s = Math.sin(i*127.1+311.7)*43758.5453; return s-Math.floor(s); };
const Y = (f,ly) => -f*FH + ly;
const lyOf = y => ((y % FH) + FH) % FH;
const floorOf = y => Math.floor(-(y-FH)/FH - 1e-6) ;

const SAVE_KEY = 'tilttower.save.v1';
const defSave = () => ({ unlocked:1, stars:Array(10).fill(0), best:Array(10).fill(0), medal:Array(10).fill(0), fichas:0, up:{power:0,length:0,balls:0,save:0,kick:0,magnet:0,floorkick:0}, parts:[], sound:true });
let S = defSave();
try { const raw = localStorage.getItem(SAVE_KEY); if(raw){ const o = JSON.parse(raw); S = Object.assign(defSave(), o); S.up = Object.assign(defSave().up, o.up||{}); } } catch(e){}
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e){} }

const UPG = [
  {id:'power',  name:'Flippers Fortes',  desc:'Lançamentos mais fortes, alcançam rampas com mais facilidade', max:5, cost:[30,60,100,150,220]},
  {id:'length', name:'Flippers Longos',  desc:'Flippers maiores: o vão do meio fica menor', max:3, cost:[60,120,200]},
  {id:'balls',  name:'Casco Reforçado',  desc:'+1 bola em cada fase', max:3, cost:[80,160,260]},
  {id:'save',   name:'Salva-Bola',       desc:'Devolve o Pino se ele cair logo depois do lançamento', max:3, cost:[50,100,170]},
  {id:'kick',   name:'Kickback',         desc:'Um pistão no vão central chuta o Pino de volta (cargas por fase)', max:3, cost:[40,90,150]},
  {id:'magnet', name:'Ímã de Fichas',    desc:'Puxa as fichas de mais longe', max:5, cost:[20,40,70,110,160]},
  {id:'floorkick', name:'Empurrão Viajante', desc:'A cada troca de andar, o buraco do andar novo ganha 1 empurrão dourado', max:1, cost:[120]},
];
const SAVE_SECS = [0,5,8,12];

/* =========================================================
   PHASES (ERA 1)
   ========================================================= */
const PHASES = [
  { name:'Salão de Bar', easy:true, floors:[{m:'bumpers',up:'L'},{m:'goal',cond:'always'}],
    golds:[[0,44,250],[1,180,110],[0,180,180]], enemies:[],
    tip:'Mande o Pino numa das duas rampas: a da esquerda ou a do centro.' },
  { name:'Fichas e Spinners', floors:[{m:'bumpers',up:'L'},{m:'orbit',up:'C'},{m:'goal',cond:'always'}],
    golds:[[0,40,200],[1,180,45],[2,180,110]], enemies:[{t:'roll',f:1,y:455,x1:110,x2:250}],
    tip:'No andar da órbita, a rampa fica no centro. O spinner dá fichas.' },
  { name:'Alvos que Caem', floors:[{m:'drop',up:'L',lock:'bank'},{m:'bumpers',up:'R'},{m:'goal',cond:'targets'}],
    golds:[[0,180,240],[1,316,250],[2,180,110]], enemies:[{t:'roll',f:1,y:410,x1:90,x2:270}],
    tip:'Derrube os 4 alvos para abrir a rampa.' },
  { name:'Relé Tagarela', boss:'relay', floors:[{m:'bumpers',up:'L'},{m:'elev'},{m:'boss'}],
    golds:[[0,44,250],[1,180,100],[2,60,330]], enemies:[],
    tip:'Sub-chefe! Acerte o botão de reset quando a proteção abrir.' },
  { name:'Corredor de Arame', floors:[{m:'roll',up:'L'},{m:'elev'},{m:'drop',up:'R',lock:'bank'},{m:'goal',cond:'bank'}],
    golds:[[0,176,92],[2,180,240],[3,180,120]], enemies:[{t:'hop',f:1,x:90,y:340},{t:'hop',f:1,x:270,y:340}],
    tip:'O elevador no centro leva o Pino direto para o andar de cima.' },
  { name:'Mariposas', floors:[{m:'bumpers',up:'L'},{m:'orbit',up:'C'},{m:'roll',up:'L'},{m:'goal',cond:'targets'}],
    golds:[[1,180,45],[2,128,92],[3,180,110]], enemies:[{t:'fly',f:0,cx:180,cy:430,rx:100,ry:40},{t:'fly',f:1,cx:180,cy:390,rx:110,ry:30},{t:'fly',f:2,cx:180,cy:410,rx:100,ry:40}],
    tip:'Mariposas freiam o Pino. Acerte-as com força para derrubá-las.' },
  { name:'Pêndulo do Tilt', boss:'pendulum', floors:[{m:'drop',up:'L',lock:'bank'},{m:'orbit',up:'C'},{m:'boss'}],
    golds:[[0,180,240],[1,180,45],[2,300,430]], enemies:[{t:'roll',f:1,y:400,x1:90,x2:270}],
    tip:'Sub-chefe! Acerte o prumo do pêndulo com força.' },
  { name:'Rollover T-I-L-T', floors:[{m:'roll',up:'L',lock:'roll'},{m:'bumpers',up:'R'},{m:'roll',up:'L',lock:'roll'},{m:'elev'},{m:'goal',cond:'targets'}],
    golds:[[0,224,92],[2,128,92],[4,180,110]], enemies:[{t:'hop',f:1,x:80,y:420},{t:'hop',f:1,x:280,y:420}],
    tip:'Acenda as 4 letras T-I-L-T para abrir a rampa. Os flippers trocam as luzes de lugar.' },
  { name:'Torre de Relés', floors:[{m:'bumpers',up:'L'},{m:'drop',up:'R',lock:'bank'},{m:'orbit',up:'C'},{m:'elev'},{m:'goal',cond:'bank'}],
    golds:[[1,180,240],[2,180,45],[4,180,120]], enemies:[{t:'roll',f:1,y:410,x1:90,x2:270},{t:'fly',f:2,cx:180,cy:390,rx:110,ry:30},{t:'hop',f:3,x:90,y:340}],
    tip:'A torre mais alta da era. Cuidado com tudo.' },
  { name:'Jukebox Rex', boss:'jukebox', floors:[{m:'roll',up:'L'},{m:'drop',up:'R',lock:'bank'},{m:'orbit',up:'C'},{m:'boss'}],
    golds:[[0,176,92],[1,180,240],[2,180,45]], enemies:[{t:'roll',f:0,y:400,x1:90,x2:270},{t:'fly',f:2,cx:180,cy:390,rx:110,ry:30},{t:'hop',f:1,x:70,y:430}],
    tip:'Chefe! Lance o Pino no slot de moedas quando a grade abrir.' },
];
const TH = pi => { const r = n => Math.round(n/1000)*1000; return { prata:r(12000+9000*pi), ouro:r(22000+16000*pi), replay:[r(8000+6000*pi), r(20000+14000*pi)] }; };
const MEDALS = ['', 'Bronze', 'Prata', 'Ouro'], MEDAL_FICHAS = [0,5,10,20], SCORE_PER_FICHA = 5000;
const SLOW_DUR = 1.2;
// "bullet time": ease down to 12% speed, hold, then ease back to normal
function startSlow(){ if(G.mode !== 'play') return; G.slowT = SLOW_DUR; G.slowUp = false; Snd.tone(520,.45,'sine',.06,140); Snd.noise(.35,.05,700); }
function slowScale(){
  if(!(G.slowT > 0)) return 1;
  const t = SLOW_DUR - G.slowT, e = u => u*u*(3-2*u);
  if(t < .12) return 1 - .65*e(t/.12);
  if(t < .5) return .35;
  return .35 + .65*e(clamp((t-.5)/.7, 0, 1));
}
const BOSS_NAMES = { relay:'Relé Tagarela', pendulum:'Pêndulo do Tilt', jukebox:'Jukebox Rex' };

/* =========================================================
   AUDIO (synthesized, electromechanical chimes)
   ========================================================= */
const Snd = {
  ac:null, out:null, sfx:null, mus:null, musFilter:null, revIn:null, nb:null, roll:null,
  init(){
    if(this.ac){ if(this.ac.state==='suspended') this.ac.resume(); Music.start(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; const ac = this.ac = new AC();
      const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = .003; comp.release.value = .18;
      this.out = ac.createGain(); this.out.gain.value = .95; comp.connect(this.out); this.out.connect(ac.destination);
      this.sfx = ac.createGain(); this.sfx.gain.value = .85; this.sfx.connect(comp);
      this.musFilter = ac.createBiquadFilter(); this.musFilter.type = 'lowpass'; this.musFilter.frequency.value = 18000; this.musFilter.Q.value = .8;
      this.mus = ac.createGain(); this.mus.gain.value = 0; this.mus.connect(this.musFilter); this.musFilter.connect(comp);
      const rev = ac.createConvolver(); rev.buffer = this.impulse(2.4, 2.8); this.revIn = ac.createGain(); this.revIn.gain.value = .55; this.revIn.connect(rev); rev.connect(comp);
      const n = ac.sampleRate*2, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0); for(let i=0;i<n;i++) d[i] = Math.random()*2-1; this.nb = b;
      // continuous rolling sound of the ball
      const rs = ac.createBufferSource(); rs.buffer = this.nb; rs.loop = true;
      const rbp = ac.createBiquadFilter(); rbp.type = 'bandpass'; rbp.frequency.value = 300; rbp.Q.value = 1.4;
      const rlp = ac.createBiquadFilter(); rlp.type = 'lowpass'; rlp.frequency.value = 900;
      const rg = ac.createGain(); rg.gain.value = 0; const rp = ac.createStereoPanner ? ac.createStereoPanner() : null;
      rs.connect(rbp); rbp.connect(rlp); rlp.connect(rg); if(rp){ rg.connect(rp); rp.connect(this.sfx); } else rg.connect(this.sfx); rs.start();
      this.roll = { bp:rbp, lp:rlp, g:rg, p:rp };
      Music.setup(); Music.start();
    } catch(e){ this.ac = null; }
  },
  impulse(sec, decay){ const ac = this.ac, n = Math.floor(ac.sampleRate*sec), b = ac.createBuffer(2, n, ac.sampleRate); for(let c=0;c<2;c++){ const d = b.getChannelData(c); for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/n, decay); } return b; },
  ok(){ return this.ac && S.sound && this.ac.state==='running'; },
  pan(){ return G.ball ? clamp((G.ball.x-180)/180*.7, -.8, .8) : 0; },
  route(node, pan, rev, dest){
    let n = node;
    if(pan && this.ac.createStereoPanner){ const p = this.ac.createStereoPanner(); p.pan.value = pan; n.connect(p); n = p; }
    n.connect(dest || this.sfx);
    if(rev){ const s = this.ac.createGain(); s.gain.value = rev; n.connect(s); s.connect(this.revIn); }
  },
  voice(o){
    if(!this.ok() && !o.music) return; if(!this.ac) return;
    const ac = this.ac, t = ac.currentTime + (o.delay||0) + (o.at ? o.at - ac.currentTime : 0), at = o.at || t;
    const osc = ac.createOscillator(), g = ac.createGain(); osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(o.f, at);
    if(o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), at + (o.glide || o.d));

function collideSeg(b, s){

}

    if(bank.targets.every(t=>t.down) && !bank.cleared){ bank.cleared = true; bank.flash = 1; addScore(1000, s.ref.x, s.ref.y-30); SFX.rampDone(); popup('ALVOS LIMPOS!', 180, s.ref.y-50, C.gold); G.gi = .8; }

function collideCircle(b, c){

function flipperTip(F){ const c = Math.cos(F.ang), s = Math.sin(F.ang); return [F.px+F.side*c*F.len, F.py+s*F.len]; }
function collideFlipper(b, F){
  const c = Math.cos(F.ang), s = Math.sin(F.ang), dx = F.side*c, dy = s;
  let t = ((b.x-F.px)*dx + (b.y-F.py)*dy)/F.len; t = t<0?0:t>1?1:t;
  const qx = F.px+dx*F.len*t, qy = F.py+dy*F.len*t;

function physStep(h){
  const L = G.L, b = G.ball;
  updateFlippers(h); updateMovers(h);
  for(const r of L.rails) if(r.cool > 0) r.cool -= h;
  for(const sc of L.saucers) if(sc.cool > 0) sc.cool -= h;

  b.vy += GRAV*h; b.x += b.vx*h; b.y += b.vy*h;
  for(const s of L.segs){ if(s.on && b.y > s.y0 && b.y < s.y1) collideSeg(b,s); }
  for(const c of L.circles){ if(Math.abs(b.y-c.y) < 60) collideCircle(b,c); }

    if(r.type==='elev' || r.locked || r.cool > 0) continue;
    if(b.x > r.mx0 && b.x < r.mx1 && Math.abs(b.y-r.y0) < (r.my||18) && b.vy < -380 && Math.abs(b.vx) < -b.vy*.75 && (G.t - (G.lastFlipHit||-9) < 1.6 || b.vy < -850)){ attachRail(r, Math.max(-b.vy, b.vx*r.tx + b.vy*r.ty)); return; }
  }

    const cr = sc.kind==='exit' && PHASES[G.pi].easy ? 22 : 14;

  }

  }

        if(!free && G.kickCharges <= 0) continue;
        b.vy = free ? -1250 : -950; b.vx = (Math.random()-.5)*(free?220:160);
        if(fk) G.floorKick[k.f]--; else if(h0) G.helperCharges--; else G.kickCharges--;
        const msg = !free ? 'KICKBACK!' : h0 && !fk ? (G.helperCharges > 0 ? `EMPURRÃO! (${G.helperCharges} restante${G.helperCharges>1?'s':''})` : 'ÚLTIMO EMPURRÃO!') : 'EMPURRÃO!';
        k.fire = 1; SFX.pop(); popup(msg, 180, k.y-40, free ? C.gold : C.red, 1.4); buzz(20); break;

function attachRail(r, u){

function railStep(h){

/* =========================================================
   FRAME UPDATE
   ========================================================= */
function update(dt){
  G.t += dt;
  const L = G.L, b = G.ball;
  if(!L) return;
  if(G.paused) return;
  // attract autopilot
  if(G.mode==='attract'){
    for(const F of L.flippers){
      const key = F.side>0?'L':'R';
      if(G.autoT[key] > 0) G.autoT[key] -= dt;
      const mx = F.px + F.side*F.len*.55;
      if(Math.abs(b.x-mx) < 46 && b.y < F.py+6 && b.y > F.py-46 && b.vy > -80 && G.autoT[key] <= 0 && Math.random()<.5) G.autoT[key] = .2;
    }
    if(G.inPlunger){ G.autoLaunchT -= dt; if(G.autoLaunchT <= 0){ launch(); G.autoLaunchT = 1; } }
  } else if(G.autoLaunchT > 0 && G.inPlunger){ G.autoLaunchT -= dt; if(G.autoLaunchT <= 0) launch(); }

  if(G.mode==='play' || G.mode==='attract'){
    const ts = slowScale(); if(G.slowT > 0){ G.slowT -= dt; if(G.slowT <= .7 && !G.slowUp){ G.slowUp = true; Snd.tone(140,.9,'sine',.07,520); } }
    G.acc = Math.min((G.acc||0) + dt*ts, STEP*16);
    while(G.acc >= STEP){ physStep(STEP); G.acc -= STEP; }
  }
  if(G.saveT > 0 && !b.rail) G.saveT -= dt;
  for(const F of L.flippers){ if(F.frozen > 0) F.frozen -= dt; F.lit = Math.max(0, F.lit-dt*3); }
  for(const c of L.bumpers) c.flash = Math.max(0, c.flash-dt*3.5);
  for(const s of L.slings) s.flash = Math.max(0, s.flash-dt*5);
  for(const e of L.enemies) e.flash = Math.max(0, e.flash-dt*4);
  for(const k of L.kickers) k.fire = Math.max(0, k.fire-dt*3);
  for(const t of L.stands) t.flash = Math.max(0, t.flash-dt*3);
  for(const bk of L.banks){ bk.flash = Math.max(0, bk.flash-dt*1.5); bk.targets.forEach(t=>t.fall=Math.max(0,t.fall-dt*4)); }
  for(const s of L.spinners){
    s.ang += s.vel*dt; s.acc += s.vel*dt; s.vel *= Math.exp(-dt*1.3);
    while(s.acc > Math.PI){ s.acc -= Math.PI; s.revs++; addScore(10, (s.x1+s.x2)/2, s.y-10, true); SFX.spin(); if(s.revs % 4 === 0) addFichas(1, (s.x1+s.x2)/2, s.y-20); }
  }
  for(const ln of L.lanes){
    ln.flash = Math.max(0, ln.flash-dt*2);
    if(ln.reset > 0){ ln.reset -= dt; if(ln.reset <= 0) ln.lit = [0,0,0,0]; }
    else if(ln.lit.every(v=>v)){ ln.ever = true; ln.flash = 1; ln.reset = 1.2; G.bonusX = Math.min(5, G.bonusX+1); comboHit(180, ln.y+30); addScore(1000, 180, ln.y+30); popup(`T-I-L-T! BÔNUS x${G.bonusX}`, 180, ln.y+60, C.gold, 1.6); SFX.rampDone(); G.gi = .8; }
  }
  // locks & exit
  for(const r of L.rails){
    if(r.lockBy==='bank') r.locked = !r.lockObj.cleared;
    else if(r.lockBy==='roll') r.locked = !r.lockObj.ever;
    if(r.gate) r.gate.on = r.locked;
  }
  if(L.exit && L.goalCond!=='boss'){
    if(L.goalCond==='targets') L.exit.lit = L.goalStands.every(t=>t.lit);
    if(L.goalCond==='bank') L.exit.lit = L.goalBank.cleared;
  }
  bossUpdate(dt);
  // coins & magnet
  const mr = 20 + S.up.magnet*16;
  for(const c of L.coins){
    if(c.taken) continue;
    const dx = b.x-c.x, dy = b.y-c.y, d = Math.hypot(dx,dy);
    if(d < BR+9){ c.taken = true; if(c.gold){ G.golds++; addFichas(10, c.x, c.y); comboHit(c.x, c.y); addScore(1000, c.x, c.y-20); SFX.gold(); sparks(c.x,c.y,C.gold,20); popup(`FICHA DOURADA ${G.golds}/3`, c.x, c.y-46, C.gold, 1.6); } else { addFichas(1, c.x, c.y); addScore(25, c.x, c.y, true); SFX.coin(); sparks(c.x,c.y,C.gold,6); } }
    else if(d < mr + BR && G.mode==='play'){ c.x += dx/d*Math.min(d, 260*dt); c.y += dy/d*Math.min(d, 260*dt); }
  }
  if(G.mode==='play' && !b.rail && !b.held && !G.done){ const fN = clamp(floorOf(b.y),0,L.n-1); if(G.lastFloor===undefined) G.lastFloor = fN; if(fN !== G.lastFloor){ G.lastFloor = fN; if(!(G.slowT > 0)) startSlow(); if(S.up.floorkick && G.mode==='play'){ G.floorKick[fN] = 1; popup('EMPURRÃO VIAJANTE', 180, b.y-50, C.gold, 1.2); } } }
  { const fNow = clamp(floorOf(b.y),0,L.n-1), flo = L.floors[fNow];
    if(flo && !flo.reached && !b.rail && !b.held){ flo.reached = true; if(G.mode==='play'){ addScore(2000, 180, b.y-60); G.floorMsg = { text:`ANDAR ${fNow+1}`, t:0 }; SFX.rampDone(); } } }
  // ball search for a stuck ball
  const cradled = L.flippers.some(F => G.press[F.side>0?'L':'R'] && Math.hypot(b.x-(F.px+F.side*F.len*.4), b.y-F.py) < 50);
  if(!G.anchor || b.rail || b.held || G.inPlunger || cradled || G.freeze || Math.hypot(b.x-G.anchor.x, b.y-G.anchor.y) > 10){ G.anchor = { x:b.x, y:b.y }; G.stillT = 0; }
  else { G.stillT += dt; if(G.stillT > 2.5){ b.vx = (Math.random()-.5)*500; b.vy = -480; G.stillT = 0; G.anchor = null; SFX.relay(); G.searches = (G.searches||0)+1; } }
  // ball cosmetics
  b.rot += (b.vx/BR)*dt*.6; spinBall(b, dt);
  b.trail.unshift([b.x,b.y]); if(b.trail.length > 7) b.trail.pop();
  // camera
  const target = clamp(b.y - view.vh*.58, Y(L.n-1,0)-100, FH+20-view.vh);
  if(!isFinite(G.cam)) G.cam = target;
  G.cam += (target-G.cam)*Math.min(1, dt*(b.rail?7:4.5));
  G.shake = Math.max(0, G.shake - dt*20);
  G.gi += (1-G.gi)*Math.min(1, dt*4); if(G.tilt) G.gi = .45;
  for(const p of G.parts){ p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 600*dt; }
  G.parts = G.parts.filter(p=>p.t<p.life);
  for(const p of G.popups){ p.t += dt; p.y -= 30*dt; }
  G.popups = G.popups.filter(p=>p.t<p.life);
  if(G.banner){ G.banner.t += dt; if(G.banner.t > G.banner.dur && !(G.inPlunger && G.banner.title.startsWith('FASE'))) G.banner = null; }
  if(G.floorMsg){ G.floorMsg.t += dt; if(G.floorMsg.t > 1.8) G.floorMsg = null; }
  if(G.done){ G.doneT += dt; if(G.doneT > 1.4 && G.mode==='play') startTally('win'); }
  updateTally(dt);
  if(G.combo && G.combo.n > 1 && G.t - G.combo.last > 5){ G.combo.n = 1; }
  reels(dt); Snd.frame(dt);
}

const app = document.getElementById('app'), cv = document.getElementById('game'), ctx = cv.getContext('2d');
const view = { scale:1, ox:0, vh:720, dpr:1, cw:0, ch:0 };
function resize(){
  view.cw = app.clientWidth || window.innerWidth || 360; view.ch = app.clientHeight || window.innerHeight || 640; view.dpr = Math.min(2.5, window.devicePixelRatio||1);
  view.scale = Math.min(view.cw/W, view.ch/600); view.ox = (view.cw - W*view.scale)/2; view.vh = view.ch/view.scale;
  cv.width = Math.round(view.cw*view.dpr); cv.height = Math.round(view.ch*view.dpr);
  if(G.L) renderStatic(G.L);
}

/* ---- static floor art (cached per floor) ---- */
function renderStatic(L){
  const res = Math.min(2.2, view.scale*view.dpr);
  L.static = [];
  for(let f=0; f<L.n; f++){
    const c = document.createElement('canvas'); c.width = Math.round(W*res); c.height = Math.round(FH*res);
    const x = c.getContext('2d'); x.scale(res,res);
    drawFloorArt(x, L, f);
    x.translate(0, f*FH);
    drawFloorStatics(x, L, f);
    L.static.push(c);
  }
}
function drawFloorArt(x, L, f){
  const hue = f/(Math.max(1,L.n-1));
  x.fillStyle = lin(x,0,0,0,FH,[`hsl(${172-hue*8},${38+hue*6}%,${17+hue*3}%)`,`hsl(${174-hue*8},40%,11%)`,'#07120f']); x.fillRect(0,0,W,FH);
  // atomic-age print
  const seed = L.pi*31 + f*7;
  for(let i=0;i<22;i++){
    const px = 30+rnd(seed+i)*300, py = 20+rnd(seed+i+50)*600, s = 8+rnd(seed+i+9)*18;
    x.globalAlpha = .06+rnd(seed+i+3)*.06; x.strokeStyle = '#f3e6c4'; x.fillStyle = '#f3e6c4'; x.lineWidth = 1.4;
    if(i%3===0){ x.beginPath(); for(let k=0;k<8;k++){ const a=k/8*TAU; x.moveTo(px+Math.cos(a)*s*.25,py+Math.sin(a)*s*.25); x.lineTo(px+Math.cos(a)*s,py+Math.sin(a)*s);} x.stroke(); }
    else if(i%3===1){ x.save(); x.translate(px,py); x.rotate(rnd(seed+i+7)*TAU); x.beginPath(); x.moveTo(-s,0); x.quadraticCurveTo(0,-s*1.1,s,0); x.quadraticCurveTo(0,-s*.45,-s,0); x.fill(); x.restore(); }
    else { x.beginPath(); x.arc(px,py,s*.35,0,TAU); x.stroke(); x.beginPath(); x.arc(px,py,s*.12,0,TAU); x.fill(); }
  }
  x.globalAlpha = .08; x.fillStyle = '#e8a94a';
  x.beginPath(); x.arc(180, 300, 150, 0, TAU); x.fill();
  x.globalAlpha = .07; x.strokeStyle = '#f3e6c4'; x.lineWidth = 2;
  for(let r=60;r<170;r+=26){ x.beginPath(); x.arc(180,300,r,0,TAU); x.stroke(); }
  x.globalAlpha = 1;

  x.fillStyle = lin(x,0,646,0,700,['#6a3c18','#3c200c']); x.beginPath(); x.moveTo(92,646); x.lineTo(150,700); x.lineTo(8,700); x.lineTo(8,600); x.lineTo(38,600); x.lineTo(76,622); x.closePath(); x.fill();
  const rx = f===0 ? 322 : 352;
  x.beginPath(); x.moveTo(268,646); x.lineTo(210,700); x.lineTo(rx,700); x.lineTo(rx,600); x.lineTo(322,600); x.lineTo(284,622); x.closePath(); x.fill();
  x.fillStyle = 'rgba(243,230,196,.85)'; x.font = '700 9px "Chakra Petch", sans-serif'; x.textAlign = 'center';
  x.save(); x.translate(40,676); x.fillText(`ANDAR ${f+1}`, 0, 0); x.restore();
  x.save(); x.translate(320,676); x.fillText(f===L.n-1 ? 'TOPO' : 'SUBA!', 0, 0); x.restore();
  // drain-gap warning print
  x.fillStyle = 'rgba(217,68,58,.18)'; x.beginPath(); x.moveTo(150,668); x.lineTo(210,668); x.lineTo(204,700); x.lineTo(156,700); x.fill();
  // printed title on the ground floor
  if(f===0){ x.globalAlpha = .16; x.fillStyle = '#f3e6c4'; x.font = '26px "Bungee Inline", Bungee, sans-serif'; x.fillText('TILT TOWER', 180, 470); x.globalAlpha = 1; }
  printDecor(x, L, f);
  // wooden side rails
  for(const sx of [0,352]){ x.fillStyle = lin(x,sx,0,sx+8,0, sx?['#3b2010','#8a5428','#5a3418']:['#5a3418','#8a5428','#3b2010']); x.fillRect(sx,0,8,FH); }
}
function drawFloorStatics(x, L, f){
  // walls
  const segs = L.segs.filter(s=>s.f===f && s.draw);
  x.lineCap = 'round';
  x.strokeStyle = 'rgba(0,0,0,.45)'; x.lineWidth = 6;
  for(const s of segs){ x.beginPath(); x.moveTo(s.ax+3,s.ay+4); x.lineTo(s.bx+3,s.by+4); x.stroke(); }
  x.strokeStyle = '#cdb47a'; x.lineWidth = 4.5;
  for(const s of segs){ x.beginPath(); x.moveTo(s.ax,s.ay); x.lineTo(s.bx,s.by); x.stroke(); }
  x.strokeStyle = 'rgba(255,248,224,.85)'; x.lineWidth = 1.3;
  for(const s of segs){ x.beginPath(); x.moveTo(s.ax-.8,s.ay-.8); x.lineTo(s.bx-.8,s.by-.8); x.stroke(); }
  // sling plastics
  for(const sl of L.slings.filter(s=>s.f===f)){
    x.fillStyle = 'rgba(0,0,0,.35)'; x.beginPath(); x.moveTo(sl.A[0]+3,sl.A[1]+4); x.lineTo(sl.B[0]+3,sl.B[1]+4); x.lineTo(sl.C[0]+3,sl.C[1]+4); x.fill();
    x.fillStyle = lin(x,sl.A[0],sl.A[1],sl.C[0],sl.C[1],['rgba(111,199,184,.85)','rgba(243,230,196,.8)']);
    x.beginPath(); x.moveTo(...sl.A); x.lineTo(...sl.B); x.lineTo(...sl.C); x.closePath(); x.fill();
    x.strokeStyle = '#e9d7a0'; x.lineWidth = 1.5; x.stroke();
    x.fillStyle = 'rgba(42,22,8,.6)'; x.font = '700 8px "Chakra Petch", sans-serif'; x.textAlign='center';
    x.fillText('10', (sl.A[0]+sl.B[0]+sl.C[0])/3, (sl.A[1]+sl.B[1]+sl.C[1])/3+3);
  }
  // posts
  for(const c of L.circles.filter(c=>c.f===f && c.kind==='post')){
    x.fillStyle = 'rgba(0,0,0,.4)'; x.beginPath(); x.arc(c.x+2,c.y+3,c.r+1,0,TAU); x.fill();
    x.fillStyle = '#f2ead8'; x.beginPath(); x.arc(c.x,c.y,c.r,0,TAU); x.fill();
    x.fillStyle = lin(x,c.x-c.r,c.y-c.r,c.x+c.r,c.y+c.r,['#fff8e0','#c9a24a','#6a4a1a']); x.beginPath(); x.arc(c.x,c.y,c.r*.55,0,TAU); x.fill();
  }
  // saucer holes
  for(const sc of L.saucers.filter(s=>s.f===f)){
    if(sc.kind==='exit'){ x.save(); x.globalAlpha = sc.visible ? 1 : .0; drawExitArch(x, sc); x.restore(); continue; }
    x.fillStyle = '#e9d7a0'; x.beginPath(); x.arc(sc.x,sc.y,15,0,TAU); x.fill();
    const g = x.createRadialGradient(sc.x,sc.y+3,1,sc.x,sc.y,12); g.addColorStop(0,'#000'); g.addColorStop(1,'#2a2010'); x.fillStyle = g; x.beginPath(); x.arc(sc.x,sc.y,12,0,TAU); x.fill();
    x.fillStyle = 'rgba(243,230,196,.75)'; x.font = '700 8px "Chakra Petch", sans-serif'; x.textAlign='center'; x.fillText('ELEVADOR', sc.x, sc.y+27);
  }
  // plunger lane
  if(f===0){
    x.fillStyle = 'rgba(0,0,0,.25)'; x.fillRect(324,165,26,525);
    x.fillStyle = lin(x,330,690,346,690,['#8a8f9a','#e9eefa','#6a7080']); x.fillRect(331,690,14,10);
    x.fillStyle = '#d9443a'; x.beginPath(); x.roundRect(326,686,24,6,3); x.fill();
  }
  // orbit print
  for(const ins of L.inserts.filter(i=>i.f===f && i.type==='orbit')){ x.globalAlpha=.1; x.strokeStyle='#f3e6c4'; x.lineWidth=18; x.beginPath(); x.ellipse(ins.x, ins.y, 150, 190, 0, Math.PI, TAU); x.stroke(); x.globalAlpha=1; }
}
function drawExitArch(x, sc){
  x.fillStyle = 'rgba(0,0,0,.35)'; x.beginPath(); x.arc(sc.x+3, sc.y-10+4, 34, Math.PI, 0); x.lineTo(sc.x+37,sc.y+24); x.lineTo(sc.x-31,sc.y+24); x.fill();

  const roof = Y(L.n-1,0);
  if(y0 < roof){
    ctx.fillStyle = lin(ctx,0,roof-120,0,roof,['#1a0c04','#5a3418','#3b200c']); ctx.fillRect(0,roof-140,W,140);
    ctx.fillStyle = '#e0b062'; ctx.fillRect(0,roof-3,W,3);
    ctx.fillStyle = 'rgba(255,179,71,.85)'; ctx.font = '15px "Bungee Inline", Bungee, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('TOPO DA TORRE', W/2, roof-14);
    for(let i=0;i<9;i++){ const x = 40+i*35, on = (i+Math.floor(T*4))%3===0; if(on) glow(ctx,x,roof-38,14,C.warm,.6); ctx.fillStyle = on?'#ffe2a8':'rgba(255,200,120,.25)'; ctx.beginPath(); ctx.arc(x,roof-38,3,0,TAU); ctx.fill(); }
  }
  // side bulbs (alternating, electromechanical style)
  for(let y = Math.floor(y0/34)*34; y < y1+34; y += 34){ for(const x of [4,356]){ const i = Math.round(y/34) + (x>180?1:0); const on = ((i + Math.floor(T*1.6)) % 2)===0; if(on) glow(ctx,x,y,24,C.warm,.45*G.gi); ctx.fillStyle = on ? '#ffe2a8' : 'rgba(255,200,120,.2)'; ctx.beginPath(); ctx.arc(x,y,3.2,0,TAU); ctx.fill(); } }
  drawDecor(L, vis);
  for(const ins of L.inserts) if(vis(ins.y)) drawInserts(ins);
  for(const ln of L.lanes) if(vis(ln.y)) drawLanes(ln);
  for(const sc of L.saucers) if(vis(sc.y)) drawSaucer(sc);
  for(const bk of L.banks) if(vis(bk.targets[0].y)) drawBank(bk);
  for(const t of L.stands) if(vis(t.y)) drawStand(t);
  for(const sp of L.spinners) if(vis(sp.y)) drawSpinner(sp);
  for(const k of L.kickers) if(vis(k.y)) drawKicker(k);
  for(const r of L.rails) drawGate(r);
  for(const c of L.coins) if(!c.taken && vis(c.y)) drawCoin(c);
  for(const sl of L.slings) if(vis(sl.A[1])) drawSling(sl);
  for(const c of L.bumpers) if(vis(c.y)) drawBumper(c);
  for(const e of L.enemies) if(e.alive && e.type!=='fly' && vis(e.y)) drawEnemy(e);
  if(L.boss) drawBoss(L.boss);
  for(const F of L.flippers) if(vis(F.py)) drawFlipper(F);
  const b = G.ball, look = clamp(b.vx/300,-1,1), sp = Math.hypot(b.vx,b.vy);
  const drawBall = () => {
    if(sp > 500 && !b.held) for(let i=b.trail.length-1;i>=1;i--){ const p = b.trail[i]; glow(ctx,p[0],p[1],BR*1.4*(1-i/9),C.warm,.12*(1-i/8)); }
    const sq = b.held ? 0 : clamp(sp/2500,0,.25);
    drawPino(b.x, b.y, BR, b.rot, look, b.held ? -.05 : 0, b.held ? Math.max(.25, 1-b.held.t*.9) : 1);
  };
  if(G.slowT > 0){ const k = (1 - slowScale())/.7; glow(ctx, b.x, b.y, 90, '255,215,160', .28*k); glow(ctx, b.x, b.y, 34, '255,240,210', .25*k); }
  if(!b.rail) drawBall();
  for(const r of L.rails) drawRail(r, y0, y1);
  if(b.rail){ glow(ctx,b.x,b.y,30,C.warm,.25); drawBall(); }
  for(const e of L.enemies) if(e.alive && e.type==='fly' && vis(e.y)) drawEnemy(e);
  if(G.freeze && G.mode==='play'){ const pul = .5+.5*Math.sin(T*6); glow(ctx,b.x,b.y,34,C.gold,.35+.3*pul); ctx.strokeStyle=`rgba(255,216,96,${.5+.4*pul})`; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(b.x,b.y,BR+6+pul*4,0,TAU); ctx.stroke(); }
  for(const p of G.parts){ const a = 1-p.t/p.life; glow(ctx,p.x,p.y,p.s*4,p.col,a*.9); ctx.fillStyle=`rgba(255,248,230,${a})`; ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s); }
  ctx.textAlign='center';
  for(const p of G.popups){ const a = Math.min(1,(p.life-p.t)*3); ctx.fillStyle=`rgba(${p.col},${a})`; ctx.font = p.text.length>12 ? '13px Bungee, sans-serif' : '12px Bungee, sans-serif'; ctx.fillText(p.text, p.x, p.y); }
  ctx.restore();
  // screen space
  ctx.setTransform(s,0,0,s,view.ox*d,0);
  drawLight(vh);
  if(G.mode==='play' || G.mode==='result' || G.mode==='over' || G.mode==='tally'){ drawHUD(vh); if(G.mode!=='tally') drawBanner(vh); drawTally(vh); }
}

/* =========================================================
   INPUT
   ========================================================= */
const pointers = new Map();
function sideOf(x){ const r = cv.getBoundingClientRect(); return (x - r.left) < r.width/2 ? 'L' : 'R'; }
function setPress(side, on){
  if(G.press[side] === on) return;
  G.press[side] = on;
  if(on && G.mode==='play' && !G.paused && G.freeze){ const fb = G.ball; fb.vx = G.freeze.vx; fb.vy = G.freeze.vy; G.freeze = null; }
  if(on && G.mode==='play' && !G.paused){
    SFX.flip(); buzz(5);
    for(const ln of G.L.lanes){ if(ln.reset > 0) continue; ln.lit = side==='L' ? ln.lit.slice(1).concat(ln.lit[0]) : [ln.lit[3]].concat(ln.lit.slice(0,3)); }
  }
}
cv.addEventListener('pointerdown', e => {
  Snd.init(); if(G.mode!=='play' || G.paused) return;
  e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch(_){}
  const side = sideOf(e.clientX); pointers.set(e.pointerId, { side, y:e.clientY, t:performance.now(), swiped:false });
  setPress(side, true);
  if(G.inPlunger) launch();
});
cv.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if(!p) return;
  if(!p.swiped && p.y - e.clientY > 70 && performance.now()-p.t < 350){ p.swiped = true; nudge(); }
});
const release = e => { const p = pointers.get(e.pointerId); if(!p) return; pointers.delete(e.pointerId); if(![...pointers.values()].some(q=>q.side===p.side)) setPress(p.side, false); };
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release); cv.addEventListener('lostpointercapture', release);
const KEYS = { ArrowLeft:'L', KeyZ:'L', ShiftLeft:'L', KeyA:'L', ArrowRight:'R', Slash:'R', ShiftRight:'R', KeyM:'R', KeyL:'R' };
window.addEventListener('keydown', e => {
  if(e.repeat) return; Snd.init();
  if(e.code==='Escape' || e.code==='KeyP'){ if(G.mode==='play') togglePause(); return; }
  if(G.mode!=='play' || G.paused) return;
  if(KEYS[e.code]){ e.preventDefault(); setPress(KEYS[e.code], true); if(G.inPlunger) launch(); }
  if(e.code==='Space' || e.code==='Enter'){ e.preventDefault(); launch(); }
  if(e.code==='ArrowUp' || e.code==='KeyW'){ e.preventDefault(); nudge(); }
});
window.addEventListener('keyup', e => { if(KEYS[e.code]) setPress(KEYS[e.code], false); });
document.addEventListener('visibilitychange', () => { if(document.hidden && G.mode==='play' && !G.paused) togglePause(); });

/* =========================================================
   SCREENS
   ========================================================= */
const $ = id => document.getElementById(id);
const screens = ['s-title','s-map','s-shop','s-pause','s-result','s-over'];
let shopReturn = 's-title';
function show(id){ screens.forEach(s => $(s).hidden = s!==id); $('pauseBtn').hidden = !(G.mode==='play' && !id); }
function soundLabel(){ const t = 'Som: '+(S.sound?'ligado':'desligado'); $('b-sound').textContent = t; $('p-sound').textContent = t; const m = 'Música: '+(S.music!==false?'ligada':'desligada'); $('b-music').textContent = m; $('p-music').textContent = m; }
function toggleMusic(){ S.music = S.music === false; save(); soundLabel(); Snd.init(); Music.applyVol(); }
function toggleSound(){ S.sound = !S.sound; save(); soundLabel(); Snd.init(); Music.applyVol(); }
function togglePause(){
  if(G.mode!=='play') return;
  G.paused = !G.paused; G.press.L = G.press.R = false; pointers.clear();
  show(G.paused ? 's-pause' : null);
}
function goAttract(){ startPhase(0, true); G.autoLaunchT = .5; }
function openMap(){
  if(G.mode!=='attract') goAttract();
  G.paused = false;
  $('m-fichas').textContent = S.fichas;
  const list = $('m-list'); list.replaceChildren();
  PHASES.forEach((P,i) => {
    const b = document.createElement('button'); b.className = 'node' + (P.boss==='jukebox' ? ' boss' : P.boss ? ' sb' : '');
    b.disabled = i+1 > S.unlocked;
    const type = P.boss==='jukebox' ? 'CHEFE' : P.boss ? 'SUB-CHEFE' : `${P.floors.length} ANDARES`;
    const st = S.stars[i];
    const md = S.medal[i]||0, best = S.best[i]||0;
    b.innerHTML = `<em>${i+1}</em><div><b></b><small>${type}${best ? ' · RECORDE '+best.toLocaleString('pt-BR') : ''}</small><small class="md m${md}">${md ? 'MEDALHA DE '+MEDALS[md].toUpperCase() : 'Prata: '+TH(i).prata.toLocaleString('pt-BR')+' · Ouro: '+TH(i).ouro.toLocaleString('pt-BR')}</small></div><span class="st">${'<b>★</b>'.repeat(st)}${'★'.repeat(3-st)}</span>`;
    b.querySelector('div b').textContent = P.name;
    b.addEventListener('click', () => { Snd.init(); play(i); });
    list.append(b);
  });
  show('s-map');
  requestAnimationFrame(() => { const unlockedBtn = list.children[Math.min(S.unlocked,10)-1]; unlockedBtn && unlockedBtn.scrollIntoView({block:'center'}); });
}
function openShop(from){
  shopReturn = from || shopReturn;
  if(G.mode!=='attract') goAttract();
  $('o-fichas').textContent = S.fichas;
  const list = $('o-list'); list.replaceChildren();
  UPG.forEach(u => {
    const lvl = S.up[u.id], max = lvl >= u.max, cost = max ? 0 : u.cost[lvl];
    const el = document.createElement('div'); el.className = 'up';
    el.innerHTML = `<b></b><span></span><div class="pips"></div><button class="buy"></button>`;
    el.querySelector('b').textContent = u.name; el.querySelector('span').textContent = u.desc;
    const p = el.querySelector('.pips'); for(let k=0;k<u.max;k++){ const i = document.createElement('i'); if(k<lvl) i.className='on'; p.append(i); }
    const bt = el.querySelector('.buy'); bt.textContent = max ? 'MÁX' : `${cost} fichas`; bt.disabled = max || S.fichas < cost;
    bt.addEventListener('click', () => { if(S.fichas >= cost && !max){ S.fichas -= cost; S.up[u.id]++; save(); SFX.rampDone(); openShop(); } });
    list.append(el);
  });
  const parts = $('o-parts'); parts.replaceChildren();
  const has = S.parts.includes('gear');
  const el = document.createElement('div'); el.className = 'part' + (has ? '' : ' off');
  el.innerHTML = `<i></i><div><b>Engrenagem Dourada</b><br><span>${has ? 'Nudge liberado: deslize o dedo para cima para sacudir a mesa. Três vezes seguidas dá TILT.' : 'Derrote a Jukebox Rex (fase 10) para ganhar a Peça de Era 1.'}</span></div>`;
  parts.append(el);
  show('s-shop');
}
function play(i){ startPhase(i); G.paused = false; show(null); }
function finishPhase(){
  Music.set('menu');
  const i = G.pi, stars = 1 + (G.golds>=3?1:0) + (G.lost?0:1), th = TH(i);
  const starF = stars*10; S.fichas += starF; G.fichasRun += starF;
  const scoreF = Math.floor(G.score / SCORE_PER_FICHA); S.fichas += scoreF; G.fichasRun += scoreF;
  const medal = G.score >= th.ouro ? 3 : G.score >= th.prata ? 2 : 1, oldMedal = S.medal[i]||0;
  let medalF = 0; for(let m=oldMedal+1; m<=medal; m++) medalF += MEDAL_FICHAS[m];
  S.fichas += medalF; G.fichasRun += medalF; S.medal[i] = Math.max(oldMedal, medal);
  const newRecord = G.score > (S.best[i]||0);
  S.stars[i] = Math.max(S.stars[i], stars); S.best[i] = Math.max(S.best[i]||0, G.score);
  S.unlocked = Math.max(S.unlocked, Math.min(10, i+2));
  let note = '';
  if(PHASES[i].boss==='jukebox'){ if(!S.parts.includes('gear')){ S.parts.push('gear'); } note = 'Era 1 concluída! Você ganhou a Engrenagem Dourada: o Nudge está liberado (deslize o dedo para cima). A Era 2 · Anos 70 vem a seguir.'; }
  save();
  $('r-title').textContent = PHASES[i].boss==='jukebox' ? 'Era 1 concluída' : PHASES[i].boss ? 'Sub-chefe derrotado' : 'Fase concluída';
  $('r-stars').innerHTML = '<b>★</b>'.repeat(stars) + '★'.repeat(3-stars);
  const time = Math.round(G.t - G.startTime);
  $('r-stats').innerHTML = '<span>Pontos'+(newRecord ? ' · NOVO RECORDE' : '')+'</span><b>'+G.score.toLocaleString('pt-BR')+'</b>'
    + '<span>Medalha</span><b class="m'+medal+'">'+MEDALS[medal]+(medal > oldMedal ? ' (nova!)' : '')+'</b>'
    + '<span>Bônus de pontos</span><b id="r-count">+0 fichas</b>'
    + '<span>Bônus de estrelas</span><b>+'+starF+' fichas</b>'
    + (medalF ? '<span>Bônus de medalha</span><b>+'+medalF+' fichas</b>' : '')
    + '<span>Fichas na fase</span><b>'+G.fichasRun+'</b>'
    + '<span>Tempo</span><b>'+Math.floor(time/60)+':'+String(time%60).padStart(2,'0')+'</b>';
  const tip = medal < 3 ? 'Próxima medalha: '+(medal < 2 ? 'Prata com '+th.prata.toLocaleString('pt-BR') : 'Ouro com '+th.ouro.toLocaleString('pt-BR'))+' pontos.' : 'Medalha de ouro! Recorde máximo da fase.';
  $('r-note').hidden = false; $('r-note').textContent = note ? note+' '+tip : tip;
  $('r-next').hidden = i >= 9;
  show('s-result');
  $('r-count').textContent = '+'+scoreF+(scoreF===1?' ficha':' fichas');
}
function countUp(n){
  const el = $('r-count'); let k = 0; if(!el) return;
  const steps = Math.min(n, 30), every = Math.max(1, Math.round(n/Math.max(1,steps)));
  const tick = () => { k = Math.min(n, k+every); el.textContent = '+'+k+(k===1?' ficha':' fichas'); Snd.chime(k%3===0?0:1); if(k < n) setTimeout(tick, 70); };
  if(n > 0) setTimeout(tick, 500);
}
function showOver(){
  Music.set('menu');
  const scoreF = Math.floor(G.score / SCORE_PER_FICHA); S.fichas += scoreF; G.fichasRun += scoreF;
  if(G.score > (S.best[G.pi]||0)) S.best[G.pi] = G.score; save();
  $('v-text').textContent = 'Você fez '+G.score.toLocaleString('pt-BR')+' pontos. Os pontos viraram +'+scoreF+' fichas, e no total você guardou '+G.fichasRun+' fichas nesta tentativa. As fichas ficam com você: gaste na Oficina e tente de novo.';
  show('s-over');
}
$('b-play').onclick = () => { Snd.init(); openMap(); };
$('b-shop').onclick = () => { Snd.init(); openShop('s-title'); };
$('b-music').onclick = toggleMusic; $('p-music').onclick = toggleMusic;
$('b-sound').onclick = toggleSound; $('p-sound').onclick = toggleSound;
$('m-back').onclick = () => show('s-title');
$('m-shop').onclick = () => openShop('s-map');
$('o-back').onclick = () => { if(shopReturn==='s-map') openMap(); else show(shopReturn); };
$('pauseBtn').onclick = () => { Snd.init(); togglePause(); };
$('p-resume').onclick = togglePause;
$('p-restart').onclick = () => play(G.pi);
$('p-map').onclick = () => { G.paused = false; openMap(); };
$('r-next').onclick = () => play(Math.min(9, G.pi+1));
$('r-shop').onclick = () => openShop('s-map');
$('r-map').onclick = openMap;
$('v-retry').onclick = () => play(G.pi);
$('v-shop').onclick = () => openShop('s-map');
$('v-map').onclick = openMap;
soundLabel();

/* =========================================================
   BOOT
   ========================================================= */
resize();
window.__tiltTower = { G, S, PHASES, startPhase, physStep, update, play, Y, draw, Music };
goAttract();
show('s-title');
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  if(app.clientWidth && (app.clientWidth !== view.cw || app.clientHeight !== view.ch)) resize();
  update(dt); draw();
  requestAnimationFrame(loop);
}
const boot = () => { if(G.L) renderStatic(G.L); requestAnimationFrame(loop); };
if(document.fonts && document.fonts.ready) document.fonts.ready.then(boot); else boot();
})();
</script>
