<title>Tilt Tower 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Inline&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen WebGL table; DOM HUD (reels, fichas, balls, mission) and start/quality controls overlaid */
:root{ --bg:#050302; --ink:#f6ecd4; --mute:#cdb68a; --amber:#ffb347; --gold:#ffd860; --teal:#6fc7b8; --line:#6a4a26;
  --f-display:"Bungee", Impact, system-ui, sans-serif; --f-inline:"Bungee Inline","Bungee",Impact,sans-serif; --f-body:"Chakra Petch", system-ui, sans-serif; color-scheme:dark; }
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;font-family:var(--f-body)}
#app{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(30,16,6,.92),rgba(30,16,6,.0));pointer-events:none}
.reels{display:flex;gap:2px;background:#140a03;border-radius:6px;padding:3px;box-shadow:0 0 0 1px #6a4a26 inset}
.reels span{width:19px;height:30px;display:grid;place-items:center;font:700 20px var(--f-body);color:#1a1208;background:linear-gradient(180deg,#5a4a30,#f6ecd0 22%,#fff8e6 50%,#f6ecd0 78%,#5a4a30);border-radius:2px}
.chip{display:flex;align-items:center;gap:6px;font:15px var(--f-display);color:#ffd9a0}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff0c0,#d8a64a 60%,#7a4a12)}
.balls{margin-left:auto;display:flex;gap:4px;align-items:center;font:600 10px var(--f-body);color:var(--mute);letter-spacing:.1em}
.balls i{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff0c0,#8a5a1c)}
#mission{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 52px);transform:translateX(-50%);font:600 12px var(--f-body);background:rgba(20,10,4,.7);border:1px solid rgba(224,176,98,.3);border-radius:999px;padding:4px 12px;white-space:nowrap;pointer-events:none}
#msg{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);font:34px var(--f-display);color:var(--gold);text-shadow:0 0 22px rgba(255,200,80,.8);pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
#launch{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);font:14px var(--f-display);color:#ffd9a0;pointer-events:none;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
#q{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font:600 11px var(--f-body);color:var(--ink);background:rgba(20,10,4,.75);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;z-index:3}
#start{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(120% 80% at 50% 35%,rgba(20,10,4,.35),rgba(5,3,2,.9))}
#start h1{margin:0;font:400 clamp(52px,16vw,92px)/.9 var(--f-inline);color:var(--amber);text-shadow:0 0 24px rgba(255,179,71,.6),4px 4px 0 #8a2a12}
#start h1 span{display:block;color:#f3e6c4;text-shadow:0 0 18px rgba(111,199,184,.5),4px 4px 0 #2a6a60}
#start p{margin:0;max-width:34ch;color:var(--mute);font-size:14px;line-height:1.45}
#start .tag{font:13px var(--f-display);letter-spacing:.14em;color:var(--teal)}
.btn{font:18px var(--f-display);color:#2a1408;background:linear-gradient(180deg,#ffe3a6,#e8a94a 55%,#c07a26);border:0;border-radius:14px;padding:14px 30px;cursor:pointer;box-shadow:0 2px 0 #fff3 inset,0 6px 18px rgba(0,0,0,.45)}
.btn:focus-visible,#q:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
#err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink);background:var(--bg);z-index:9}
</style>

<div id="app">
  <canvas id="gl" aria-label="Mesa de pinball 3D"></canvas>
  <div id="hud"><div class="reels" id="reels"></div><div class="chip"><i class="coin"></i><span id="fichas">0</span></div><div class="balls" id="balls">BOLAS</div></div>
  <div id="mission">Acerte uma das rampas (esquerda ou centro)</div>
  <div id="msg"></div>
  <div id="launch" hidden>TOQUE PARA LANÇAR</div>
  <button id="q">Qualidade: Alta</button>
  <div id="start">
    <div class="tag">PROTÓTIPO 3D · ANDAR 1</div>
    <h1>Tilt<span>Tower</span></h1>
    <p>Toque na metade esquerda ou direita da tela para usar os flippers. As rampas sobem por cima da mesa e voltam pelos trilhos de arame.</p>
    <button class="btn" id="go">Jogar</button>
  </div>
  <div id="err" hidden></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
'use strict';
if(!window.THREE){ const e = document.getElementById('err'); e.hidden = false; e.textContent = 'Não foi possível carregar o motor 3D. Verifique a conexão e recarregue a página.'; return; }
const W = 360, FH = 700, GRAV = 1000, BR = 12, TAU = Math.PI*2, STEP = 1/600;
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const rnd = i => { const s = Math.sin(i*127.1+311.7)*43758.5453; return s-Math.floor(s); };

/* ================= AUDIO ================= */
const Snd = { ac:null, m:null, nb:null,
  init(){ if(this.ac){ if(this.ac.state==='suspended') this.ac.resume(); return; } try { this.ac = new (window.AudioContext||window.webkitAudioContext)(); this.m = this.ac.createGain(); this.m.gain.value = .5; this.m.connect(this.ac.destination); const n = this.ac.sampleRate, b = this.ac.createBuffer(1,n,n), d = b.getChannelData(0); for(let i=0;i<n;i++) d[i] = Math.random()*2-1; this.nb = b; } catch(e){} },
  ok(){ return this.ac && this.ac.state==='running'; },
  tone(f,d,type='sine',v=.2,f2=0,dl=0){ if(!this.ok()) return; const t = this.ac.currentTime+dl, o = this.ac.createOscillator(), g = this.ac.createGain(); o.type = type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.005); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(this.m); o.start(t); o.stop(t+d+.03); },
  noise(d,v=.2,lp=2000,hp=20){ if(!this.ok()) return; const t = this.ac.currentTime, s = this.ac.createBufferSource(); s.buffer = this.nb; const a = this.ac.createBiquadFilter(); a.type='lowpass'; a.frequency.value=lp; const b = this.ac.createBiquadFilter(); b.type='highpass'; b.frequency.value=hp; const g = this.ac.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); s.connect(a); a.connect(b); b.connect(g); g.connect(this.m); s.start(t,Math.random()*.5); s.stop(t+d+.03); },
  chime(k,dl=0){ [[1318.5,2637],[987.8,1975.5],[659.3,1318.5]][k].forEach((f,i)=>this.tone(f,1-i*.35,'sine',[.1,.035][i],0,dl)); },
};
let lastChime = 0, now = 0;
const SFX = {
  flip(){ Snd.noise(.05,.18,900,60); Snd.tone(120,.06,'square',.05,60); },
  pop(){ Snd.tone(190,.09,'square',.11,80); Snd.noise(.05,.15,1600); if(now-lastChime>.08){ Snd.chime(1); lastChime = now; } },
  sling(){ Snd.noise(.05,.2,1300); if(now-lastChime>.08){ Snd.chime(2); lastChime = now; } },
  coin(){ Snd.tone(1568,.05,'square',.04); Snd.tone(2093,.09,'square',.04,0,.05); },
  ramp(){ Snd.tone(90,.6,'sawtooth',.05,240); Snd.noise(.5,.06,500); },
  rampDone(){ Snd.chime(0); Snd.chime(1,.12); Snd.chime(2,.24); },
  drain(){ Snd.tone(420,.7,'sawtooth',.1,70); },
  launch(){ Snd.noise(.18,.28,700); Snd.tone(80,.18,'sine',.28,40); },
  kick(){ Snd.tone(95,.12,'square',.16,50); Snd.noise(.08,.2,900); },
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };

/* ================= TABLE GEOMETRY (physics, in table units) ================= */
const segs = [], circles = [], bumpers = [], slings = [], flippers = [], coins = [], rails = [];
const seg = (ax,ay,bx,by,o={}) => { const s = { ax,ay,bx,by, r:o.r??2.5, e:o.e??.35, kind:o.kind||'wall', ref:o.ref||null, oneway:o.oneway||null, draw:o.draw??true, h:o.h??12 }; segs.push(s); return s; };
const poly = (pts,o) => { for(let i=0;i<pts.length-1;i++) seg(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],o); };
const post = (x,y,r=6) => { const c = { x,y,r,e:.6,kind:'post' }; circles.push(c); return c; };
const bumper = (x,y,r=20) => { const c = { x,y,r,e:.3,kind:'bumper',flash:0 }; circles.push(c); bumpers.push(c); return c; };
const sling = (A,B,C) => { const s = { A,B,C,flash:0 }; slings.push(s); seg(A[0],A[1],B[0],B[1],{draw:false}); seg(B[0],B[1],C[0],C[1],{draw:false}); seg(A[0],A[1],C[0],C[1],{draw:false,kind:'sling',ref:s,e:.2}); [A,B,C].forEach(p=>post(p[0],p[1],4)); };
const flipper = (px,py,len,side) => { const F = { px,py,len,side,r1:11,r2:6,rest:.52,up:-.42,ang:.52,av:0,lit:0 }; flippers.push(F); return F; };

seg(8,90,8,700); seg(352,0,352,700);
poly([[8,90],[30,32],[90,6],[270,6]]);
seg(38,470,38,700); seg(38,585,76,622); seg(12,430,38,470); post(38,470,5);
seg(322,180,322,700); post(322,180,4);
const arc = []; for(let a=0;a>=-90;a-=15){ const r = a*Math.PI/180; arc.push([262+90*Math.cos(r),150+90*Math.sin(r)]); }
poly(arc); seg(arc[arc.length-1][0],arc[arc.length-1][1],270,6);
seg(352,146,324,172,{oneway:[-.68,-.73],draw:false,kind:'flap'});
seg(322,690,352,690,{draw:false});
seg(322,585,284,622);
sling([74,505],[74,572],[116,598]); sling([286,505],[286,572],[244,598]);
seg(92,646,150,700); seg(268,646,210,700);
seg(8,700,150,700,{draw:false}); seg(210,700,352,700,{draw:false});
const FL = flipper(86,632,72,1), FR = flipper(274,632,72,-1);
bumper(110,240,20); bumper(250,240,20); post(70,150,7);
[[120,122],[150,104],[180,97],[210,104],[240,122],[60,300],[300,330],[180,420]].forEach(([x,y])=>coins.push({x,y,taken:false,ph:Math.random()*6}));

/* rails with height (x, y, h) */
function mkPath(pts, step=6){
  const cr = (p0,p1,p2,p3,t) => { const t2=t*t, t3=t2*t; return [0,1].map(k=>.5*((2*p1[k])+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3)); };
  const out = [];
  for(let i=0;i<pts.length-1;i++){ const p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(pts.length-1,i+2)]; const n = Math.max(2,Math.ceil(Math.hypot(p2[0]-p1[0],p2[1]-p1[1])/step)); for(let k=0;k<n;k++){ const q = cr(p0,p1,p2,p3,k/n); const u = k/n, hh = p1[2]+(p2[2]-p1[2])*(u*u*(3-2*u)); out.push([q[0],q[1],hh]); } }
  out.push(pts[pts.length-1].slice());
  const len = [0]; for(let i=1;i<out.length;i++) len.push(len[i-1]+Math.hypot(out[i][0]-out[i-1][0],out[i][1]-out[i-1][1],out[i][2]-out[i-1][2]));
  let apex = 0; out.forEach((p,i)=>{ if(p[2] > out[apex][2]) apex = i; });
  return { p:out, len, L:len[len.length-1], apex };
}
function pathAt(P,s,hint){
  let i = clamp(hint|0,0,P.p.length-2);
  while(i<P.p.length-2 && P.len[i+1]<s) i++; while(i>0 && P.len[i]>s) i--;
  const a = P.p[i], b = P.p[i+1], sl = (P.len[i+1]-P.len[i])||1, u = clamp((s-P.len[i])/sl,0,1);
  return { x:a[0]+(b[0]-a[0])*u, y:a[1]+(b[1]-a[1])*u, h:a[2]+(b[2]-a[2])*u, tx:(b[0]-a[0])/sl, ty:(b[1]-a[1])/sl, th:(b[2]-a[2])/sl, i };
}
rails.push({ name:'esquerda', path:mkPath([[60,366,0],[44,250,16],[30,120,38],[56,46,56],[180,24,64],[292,44,56],[332,130,46],[340,270,34],[330,400,18],[305,470,6],[305,505,0]]), y0:366, mx0:8, mx1:170, my:42, cool:0 });
rails.push({ name:'centro', path:mkPath([[180,150,0],[180,80,24],[150,36,42],[84,40,50],[36,120,42],[24,260,30],[32,400,14],[53,470,5],[53,505,0]]), y0:150, mx0:120, mx1:240, my:34, cool:0 });
seg(94,395,94,350); post(94,350,5);

/* ================= STATE ================= */
const G = { ball:null, press:{L:false,R:false}, score:0, fichas:0, balls:3, inPlunger:true, started:false, shake:0, gi:1, ramps:0, acc:0, stillT:0, anchor:null, kickFire:0, over:false };
function newBall(){ G.ball = { x:337, y:676, vx:0, vy:0, rail:null, h:0 }; G.inPlunger = true; }
newBall();

/* ================= PHYSICS ================= */
function collideSeg(b,s){
  const abx = s.bx-s.ax, aby = s.by-s.ay, L2 = abx*abx+aby*aby||1;
  let t = ((b.x-s.ax)*abx+(b.y-s.ay)*aby)/L2; t = t<0?0:t>1?1:t;
  const px = s.ax+abx*t, py = s.ay+aby*t; let dx = b.x-px, dy = b.y-py; const R = BR+s.r, d2 = dx*dx+dy*dy;
  if(d2 >= R*R) return;
  let d = Math.sqrt(d2); if(d<1e-4){ dx = -aby; dy = abx; d = Math.hypot(dx,dy)||1; }
  const nx = dx/d, ny = dy/d;
  if(s.oneway && nx*s.oneway[0]+ny*s.oneway[1] <= 0) return;
  b.x = px+nx*R; b.y = py+ny*R;
  const vn = b.vx*nx+b.vy*ny;
  if(vn < 0){
    b.vx -= (1+s.e)*vn*nx; b.vy -= (1+s.e)*vn*ny; b.vx *= .998; b.vy *= .998;
    if(s.kind==='sling' && -vn > 40){ const out = b.vx*nx+b.vy*ny; if(out < 560){ b.vx += nx*(560-out); b.vy += ny*(560-out); } s.ref.flash = 1; SFX.sling(); addScore(10); burst(b.x-nx*BR, b.y-ny*BR, 0x9ff0e4, 10); G.gi = Math.min(G.gi,.9); buzz(6); }
  }
}
function collideCircle(b,c){
  const dx = b.x-c.x, dy = b.y-c.y, R = BR+c.r, d2 = dx*dx+dy*dy; if(d2 >= R*R) return;
  const d = Math.sqrt(d2)||1, nx = dx/d, ny = dy/d; b.x = c.x+nx*R; b.y = c.y+ny*R;
  const vn = b.vx*nx+b.vy*ny; if(vn < 0){ b.vx -= (1+c.e)*vn*nx; b.vy -= (1+c.e)*vn*ny; }
  if(ny < -.85 && Math.abs(b.vx) < 8) b.vx += (Math.random()<.5?-1:1)*25;
  if(c.kind==='bumper'){ const out = b.vx*nx+b.vy*ny; if(out < 640 && (vn < -20 || c.flash < .2)){ b.vx += nx*(640-out) + (Math.random()-.5)*40; b.vy += ny*(640-out); c.flash = 1; SFX.pop(); addScore(100); burst(c.x+nx*c.r, c.y+ny*c.r, 0xffc880, 16); G.gi = Math.min(G.gi,.85); G.shake = Math.max(G.shake,3); buzz(8); } }
}
function collideFlipper(b,F){
  const c = Math.cos(F.ang), s = Math.sin(F.ang), dx = F.side*c, dy = s;
  let t = ((b.x-F.px)*dx+(b.y-F.py)*dy)/F.len; t = t<0?0:t>1?1:t;
  const qx = F.px+dx*F.len*t, qy = F.py+dy*F.len*t; let nx = b.x-qx, ny = b.y-qy; const R = BR+F.r1+(F.r2-F.r1)*t, d2 = nx*nx+ny*ny;
  if(d2 >= R*R) return;
  let d = Math.sqrt(d2); if(d<1e-4){ nx = 0; ny = -1; d = 1; } nx /= d; ny /= d; b.x = qx+nx*R; b.y = qy+ny*R;
  const dist = F.len*t, svx = dist*F.av*(-F.side*s), svy = dist*F.av*c, rvx = b.vx-svx, rvy = b.vy-svy, vn = rvx*nx+rvy*ny;
  if(vn < 0){ b.vx -= 1.3*vn*nx; b.vy -= 1.3*vn*ny; if(-vn > 500 && Math.abs(F.av) > 2){ F.lit = 1; G.shake = Math.max(G.shake,1.5); burst(b.x-nx*BR, b.y-ny*BR, 0xffffff, 6); } }
}
function physStep(h){
  for(const F of flippers){
    const pressed = G.press[F.side>0?'L':'R'];
    const target = pressed ? F.up : F.rest, prev = F.ang;
    if(F.ang > target) F.ang = Math.max(target, F.ang - 30*h); else F.ang = Math.min(target, F.ang + 20*h);
    F.av = (F.ang-prev)/h;
  }
  for(const r of rails) if(r.cool > 0) r.cool -= h;
  const b = G.ball;
  if(b.rail){ railStep(h); return; }
  b.vy += GRAV*h; b.x += b.vx*h; b.y += b.vy*h;
  for(const s of segs) collideSeg(b,s);
  for(const c of circles) collideCircle(b,c);
  for(const F of flippers) collideFlipper(b,F);
  const sp = Math.hypot(b.vx,b.vy); if(sp > 1700){ b.vx *= 1700/sp; b.vy *= 1700/sp; }
  for(const r of rails){ if(r.cool > 0) continue; if(b.x > r.mx0 && b.x < r.mx1 && Math.abs(b.y-r.y0) < r.my && b.vy < -120){ b.rail = { r, s:2, u:Math.max(-b.vy*.9, 300), hint:0 }; SFX.ramp(); return; } }
  if(b.vy > 0 && b.x > 140 && b.x < 220 && b.y > 670 && b.y < 698){ b.vy = -1000; b.vx = (Math.random()-.5)*200; G.kickFire = 1; SFX.kick(); buzz(15); }
  G.inPlunger = b.x > 322 && b.y > 560 && b.y < 700;
  if(b.y > 760) drain();
}
function railStep(h){
  const b = G.ball, R = b.rail, P = R.r.path, pa = pathAt(P,R.s,R.hint);
  R.u += (-GRAV*.6*pa.th - 40)*h; R.u = Math.min(R.u, 900); R.s += R.u*h;
  if(R.s >= P.L){ const e = pathAt(P,P.L-1,P.p.length-2); b.x = P.p[P.p.length-1][0]; b.y = P.p[P.p.length-1][1]; b.h = 0; const u = Math.max(R.u,160); b.vx = e.tx*u; b.vy = e.ty*u; b.rail = null; R.r.cool = .6; rampDone(R.r); return; }
  if(R.s <= 0){ b.rail = null; b.h = 0; b.vx = 0; b.vy = 200; R.r.cool = .7; return; }
  const q = pathAt(P,R.s,pa.i); R.hint = q.i; const ox = b.x, oy = b.y; b.x = q.x; b.y = q.y; b.h = q.h; b.vx = (b.x-ox)/h; b.vy = (b.y-oy)/h;
}
function rampDone(r){ G.ramps++; addScore(1000); SFX.rampDone(); G.gi = .8; flash(`RAMPA! ${G.ramps}`); }
function drain(){
  SFX.drain(); G.shake = 6; buzz(60); G.balls--;
  if(G.balls <= 0){ G.over = true; flash('FIM DE JOGO'); setTimeout(()=>{ G.balls = 3; G.score = 0; G.ramps = 0; G.over = false; coins.forEach(c=>c.taken=false); newBall(); }, 2000); }
  newBall();
}

const camState = { z:0, shakeX:0, shakeY:0 };
function resize(){
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
  if(composer){ composer.setSize(w, h); if(bloom) bloom.resolution.set(w/2, h/2); }
}
addEventListener('resize', resize);
function updateCamera(dt){
  const b = G.ball, aspect = camera.aspect;
  const hf = 2*Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*aspect);
  const portrait = aspect < .8;
  const dist = Math.max(portrait ? 600 : 780, (portrait ? 206 : 236)/Math.tan(hf/2));
  const tz = clamp(Z(b.y)*(portrait ? .25 : .35), -110, 90);
  camState.z += (tz - camState.z)*Math.min(1, dt*2.5);
  const tx = 0, ty = 0, tzz = camState.z + (portrait ? 10 : -40);
  const dir = portrait ? new THREE.Vector3(0, .93, .37).normalize() : new THREE.Vector3(0, .78, .62).normalize();
  const sh = G.shake;
  camera.position.set(tx + dir.x*dist + (Math.random()-.5)*sh, ty + dir.y*dist + (Math.random()-.5)*sh, tzz + dir.z*dist);
  camera.lookAt(tx, ty, tzz);
}

/* ================= HUD ================= */
const reelsEl = document.getElementById('reels'); for(let i=0;i<7;i++){ const s = document.createElement('span'); s.textContent = '0'; reelsEl.append(s); }
let shownScore = -1, msgT = 0;
function hud(){
  if(G.score !== shownScore){ shownScore = G.score; const d = String(Math.min(9999999,G.score)).padStart(7,'0'); [...reelsEl.children].forEach((s,i)=>s.textContent = d[i]); }
  document.getElementById('fichas').textContent = G.fichas;
  const bl = document.getElementById('balls'); const want = Math.max(0,G.balls-1); if(bl.dataset.n != want){ bl.dataset.n = want; bl.innerHTML = 'BOLAS ' + '<i></i>'.repeat(want); }
  document.getElementById('launch').hidden = !(G.started && G.inPlunger && Math.abs(G.ball.vy) < 40);
  document.getElementById('mission').textContent = `Acerte uma das rampas (esquerda ou centro) · rampas: ${G.ramps}`;
}
function flash(text){ const m = document.getElementById('msg'); m.textContent = text; m.style.opacity = 1; msgT = 1.6; }

/* ================= INPUT ================= */
const pointers = new Map();
function setPress(k,on){ if(G.press[k]===on) return; G.press[k] = on; if(on){ SFX.flip(); buzz(5); } }
canvas.addEventListener('pointerdown', e => { Snd.init(); if(!G.started) return; e.preventDefault(); try { canvas.setPointerCapture(e.pointerId); } catch(_){} const side = e.clientX < innerWidth/2 ? 'L' : 'R'; pointers.set(e.pointerId, side); setPress(side, true); if(G.inPlunger) launch(); });
const rel = e => { const s = pointers.get(e.pointerId); if(!s) return; pointers.delete(e.pointerId); if(![...pointers.values()].includes(s)) setPress(s,false); };
canvas.addEventListener('pointerup', rel); canvas.addEventListener('pointercancel', rel);
const KEYS = { ArrowLeft:'L', KeyZ:'L', ShiftLeft:'L', ArrowRight:'R', KeyM:'R', ShiftRight:'R' };
addEventListener('keydown', e => { if(e.repeat) return; Snd.init(); if(!G.started) return; if(KEYS[e.code]){ e.preventDefault(); setPress(KEYS[e.code], true); if(G.inPlunger) launch(); } if(e.code==='Space'){ e.preventDefault(); launch(); } });
addEventListener('keyup', e => { if(KEYS[e.code]) setPress(KEYS[e.code], false); });
document.getElementById('go').onclick = () => { Snd.init(); G.started = true; document.getElementById('start').hidden = true; flash('ANDAR 1'); };
document.getElementById('q').onclick = () => { quality = quality==='alta' ? 'leve' : 'alta'; applyQuality(); };

/* ================= LOOP ================= */
let last = performance.now(), fpsAcc = 0, fpsN = 0, autoChecked = false;
const tmpQ = new THREE.Quaternion(), tmpV = new THREE.Vector3(), camDir = new THREE.Vector3();
function frame(t){
  const dt = Math.min(.05, (t-last)/1000); last = t; now += dt;
  if(G.started && !G.over){ G.acc = Math.min(G.acc+dt, STEP*16); while(G.acc >= STEP){ physStep(STEP); G.acc -= STEP; } }
  else if(!G.started){ // attract: idle flipper twitch
    FL.ang = FR.ang = .52;
  }
  const b = G.ball;
  // ball search
  if(!G.anchor || b.rail || G.inPlunger || Math.hypot(b.x-G.anchor.x,b.y-G.anchor.y) > 10 || G.press.L || G.press.R){ G.anchor = {x:b.x,y:b.y}; G.stillT = 0; } else { G.stillT += dt; if(G.stillT > 2.5){ b.vx = (Math.random()-.5)*400; b.vy = -420; G.stillT = 0; } }
  // coins
  for(const c of coins){ if(c.taken) continue; c.mesh.rotation.z += dt*3; c.mesh.position.y = 14 + Math.sin(now*3+c.ph)*2; if(Math.hypot(b.x-c.x,b.y-c.y) < BR+9 && b.h < 10){ c.taken = true; c.mesh.visible = false; G.fichas++; addScore(25); SFX.coin(); burst(c.x,c.y,0xffd860,14); } }
  // visuals sync
  const by = BR + (b.h||0);
  const ox = ball.position.x, oz = ball.position.z;
  ball.position.set(X(b.x), by, Z(b.y));
  const mvx = ball.position.x-ox, mvz = ball.position.z-oz, dist = Math.hypot(mvx,mvz);
  if(dist > .001 && dist < 60){ tmpV.set(mvz, 0, -mvx).normalize(); tmpQ.setFromAxisAngle(tmpV, dist/BR); ballMesh.quaternion.premultiply(tmpQ); }
  camDir.copy(camera.position).sub(ball.position).normalize();
  eye.position.copy(camDir).multiplyScalar(BR+.2); eye.lookAt(camera.position.x - ball.position.x + eye.position.x, camera.position.y - ball.position.y + eye.position.y, camera.position.z - ball.position.z + eye.position.z);
  eyeGlow.material.opacity = .75 + .25*Math.sin(now*23);
  for(const F of flippers){ F.grp.rotation.y = -(F.side>0 ? F.ang : Math.PI-F.ang); F.lit = Math.max(0,F.lit-dt*3); F.body.material.emissiveIntensity = F.lit*.6; }
  for(const c of bumpers){ c.flash = Math.max(0, c.flash-dt*3.5); const f = c.flash; c.mesh.cap.material.emissiveIntensity = .15 + f*2.5; c.mesh.body.material.emissive.setRGB(.25+f*.8, f*.2, 0); c.mesh.light.intensity = (.35 + f*3)*G.gi; c.mesh.g.scale.setScalar(1 + f*.06); }
  for(const s of slings){ s.flash = Math.max(0, s.flash-dt*5); s.band.material.emissiveIntensity = s.flash*2; }
  G.kickFire = Math.max(0, G.kickFire-dt*3); kicker.position.y = 3 + G.kickFire*8; kicker.material.emissiveIntensity = .2 + G.kickFire*2 + .1*Math.sin(now*5);
  plunger.position.z = Z(700) + (G.inPlunger && Math.abs(b.vy) < 40 ? Math.sin(now*4)*2 : 0);
  rampLamps.forEach(L => { const k = ((L.i/3 - Math.floor(now*10))%5+5)%5; L.sprite.material.opacity = k===0 ? .9 : .12; });
  arrows.forEach((a,i) => { a.material.opacity = ((Math.floor(now*6)-i%2)%3+3)%3===0 ? .95 : .2; });
  bulbs.forEach(B => { const on = ((B.i + Math.floor(now*1.6)) % 2)===0; B.sp.material.opacity = (on ? .85 : .1)*G.gi; });
  rays.forEach((r,i) => { r.rotation.z = Math.sin(now*.3+i)*.04; r.material.opacity = (i ? .06 : .1)*G.gi; });
  for(let i=0;i<dustN;i++){ const s = dustSeed[i]; const y = ((s[1] + now*(.01+s[2]*.02))%1)*700; const cone = i%3 ? rays[0] : rays[1]; const rr = (y/900)*(i%3?160:110)*.9*s[2]; const a = s[0]*TAU + now*.1; dustPos[i*3] = cone.position.x + Math.cos(a)*rr; dustPos[i*3+1] = 900 - y - 450 + 450*0 + (450 - y*0); dustPos[i*3+1] = (520 - y*.74); dustPos[i*3+2] = cone.position.z + Math.sin(a)*rr; }
  dustGeo.attributes.position.needsUpdate = true;
  for(let i=0;i<SPN;i++){ const p = sparks[i]; if(p){ p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt; p.vy -= 700*dt; const a = Math.max(0,1-p.t/p.life); spPos[i*3] = p.x; spPos[i*3+1] = Math.max(1,p.y); spPos[i*3+2] = p.z; spCol[i*3] = p.c.r*a; spCol[i*3+1] = p.c.g*a; spCol[i*3+2] = p.c.b*a; } else { spCol[i*3] = spCol[i*3+1] = spCol[i*3+2] = 0; } }
  for(let i=sparks.length-1;i>=0;i--) if(sparks[i].t > sparks[i].life) sparks.splice(i,1);
  spGeo.attributes.position.needsUpdate = true; spGeo.attributes.color.needsUpdate = true;
  G.gi += (1-G.gi)*Math.min(1,dt*4); hemi.intensity = .45*G.gi; key.intensity = 2.4*(.75+.25*G.gi);
  G.shake = Math.max(0, G.shake - dt*20);
  if(msgT > 0){ msgT -= dt; if(msgT <= 0) document.getElementById('msg').style.opacity = 0; }
  updateCamera(dt); hud();
  if(composer && quality==='alta') composer.render(); else renderer.render(scene, camera);
  // auto-quality: drop to light mode on slow devices
  if(G.started && !autoChecked){ fpsAcc += dt; fpsN++; if(fpsAcc > 4){ autoChecked = true; if(fpsN/fpsAcc < 34 && quality==='alta'){ quality = 'leve'; applyQuality(); flash('MODO LEVE'); } } }
  requestAnimationFrame(frame);
}
applyQuality();
window.__t3 = { G, physStep, rails, flippers };
requestAnimationFrame(frame);
})();
</script>
