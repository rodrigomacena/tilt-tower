<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Tilt Tower</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Pinball vertical: suba a torre por 5 eras, dos anos 60 ao futuro.">
<meta name="theme-color" content="#0b0604">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tilt Tower">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: full-screen portrait pinball canvas; DOM screens (title, map, workshop, pause, results) float over an attract-mode table */
:root{
  --bg:#0b0604; --wood:#4a2a12; --wood2:#2a1608; --brass:#e0b062; --cream:#f3e6c4; --amber:#ffb347; --red:#d9443a; --teal:#6fc7b8;
  --ink:#f6ecd4; --mute:#cdb68a; --panel:rgba(24,12,5,.94); --line:#6a4a26;
  --f-display:"Bungee", "Impact", system-ui, sans-serif;
  --f-inline:"Bungee Inline", "Bungee", "Impact", sans-serif;
  --f-body:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
.ghost.danger{opacity:.75;font-size:.85em}.ghost.danger.armed{opacity:1;color:#ff8a7a;border-color:#ff8a7a}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
#rotate{position:fixed;inset:0;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);color:var(--cream);font-family:var(--f-display);text-align:center;padding:24px}
#rotate .ph{width:46px;height:78px;border:4px solid var(--amber);border-radius:10px;animation:rot 1.8s ease-in-out infinite}
#rotate p{margin:0;font-size:18px;letter-spacing:.06em}
@keyframes rot{0%,30%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}
@media (orientation:landscape) and (pointer:coarse) and (max-height:600px){ #rotate{display:flex} }
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--f-body);font-size:16px}
#app{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:16px;overflow-y:auto;
  padding:28px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 80% at 50% 20%, rgba(20,10,4,.35), rgba(8,4,2,.82));touch-action:pan-y}
.screen.center{justify-content:center}
.logo{font-family:var(--f-inline);font-weight:400;font-size:clamp(56px,17vw,96px);line-height:.9;text-align:center;margin:0;color:var(--amber);
  text-shadow:0 0 22px rgba(255,179,71,.55),0 0 2px #fff4d0,5px 5px 0 #8a2a12}
.logo span{display:block;color:var(--cream);text-shadow:0 0 18px rgba(255,220,170,.5),5px 5px 0 #2a6a60}
.era{font-family:var(--f-display);font-size:14px;letter-spacing:.12em;color:var(--teal);text-align:center}
.hint{max-width:34ch;text-align:center;color:var(--mute);font-size:14px;line-height:1.45;margin:0}
.btn{font-family:var(--f-display);font-size:18px;letter-spacing:.03em;color:#2a1408;background:linear-gradient(180deg,#ffe3a6,#e8a94a 55%,#c07a26);
  border:0;border-radius:14px;padding:14px 26px;min-width:230px;cursor:pointer;box-shadow:0 2px 0 #fff3 inset,0 -3px 0 #0003 inset,0 6px 18px rgba(0,0,0,.45),0 0 24px rgba(255,170,70,.25)}
.btn:active{transform:translateY(2px)}
.btn.ad{background:linear-gradient(180deg,#a6f0e0,#3fb8a0 55%,#1f7d6c);font-size:15px}.btn.ad:disabled{opacity:.55}.btn.noads{font-size:15px}.btn.noads:disabled{opacity:.6}
.btn:focus-visible,.ghost:focus-visible,.node:focus-visible,.buy:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.btn.alt{background:linear-gradient(180deg,#3c2412,#24130a);color:var(--cream);box-shadow:0 0 0 1px var(--line) inset,0 6px 18px rgba(0,0,0,.45)}
.ghost{font-family:var(--f-body);font-weight:600;font-size:14px;color:var(--cream);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.col{display:flex;flex-direction:column;gap:12px;align-items:center}
.bar{width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;text-align:center}
.wallet{font-family:var(--f-display);font-size:15px;color:var(--amber);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.wallet i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff0c0,#d8a64a 60%,#7a4a12);display:inline-block}
.tower{width:100%;max-width:460px;display:flex;flex-direction:column-reverse;gap:8px}
.node{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;
  background:linear-gradient(180deg,#2e1a0c,#1c0f06);border:1px solid var(--line);border-radius:14px;padding:10px 14px;color:var(--ink);cursor:pointer;font-family:var(--f-body)}
.node em{font-style:normal;font-family:var(--f-display);font-size:22px;color:var(--amber);text-align:center}
.node b{display:block;font-size:15px}
.node small{display:block;font-size:12px;color:var(--mute);letter-spacing:.06em}
.node small.md{font-size:11px;font-weight:700}
.node small.m1{color:#d8955a}.node small.m2{color:#dfe4f0}.node small.m3{color:#ffd860}
.node .st{font-size:16px;letter-spacing:2px;color:#5a4028}
.node .st b{display:inline;color:var(--amber)}
.node.sb{border-color:#a0582a;background:linear-gradient(180deg,#3a1c0c,#1f0e05)}
.node.boss{border-color:var(--red);background:linear-gradient(180deg,#4a160c,#200805);box-shadow:0 0 18px rgba(217,68,58,.25)}
.node[disabled]{opacity:.38;cursor:default}
.eras{width:100%;max-width:460px;display:flex;gap:8px}
.eras button{flex:1;font-family:var(--f-display);font-size:13px;color:var(--cream);background:linear-gradient(180deg,#2e1a0c,#1c0f06);border:1px solid var(--line);border-radius:12px;padding:10px 8px;cursor:pointer}
.eras button.on{color:#2a1408;background:linear-gradient(180deg,#ffe3a6,#e8a94a 55%,#c07a26)}
.eras button.e4.on{background:linear-gradient(180deg,#a0fff0,#b45af0 60%,#2a0a48)}
.eras button.e5.on{background:linear-gradient(180deg,#ffffff,#7ae8ff 55%,#2a4a7a)}
.eras button.e3.on{background:linear-gradient(180deg,#9af0ff,#ff5ad0 60%,#5a1a8a)}
.eras button.e2.on{background:linear-gradient(180deg,#ffb0e0,#c86ad8 55%,#7a3ab0)}
.eras button[disabled]{opacity:.4;cursor:default}
.locked{width:100%;max-width:460px;border:1px dashed var(--line);border-radius:14px;padding:12px 14px;color:var(--mute);font-size:13px;text-align:center}
.shop{width:100%;max-width:460px;display:flex;flex-direction:column;gap:10px}
.up{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:linear-gradient(180deg,#2e1a0c,#1c0f06);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.up b{font-weight:700}
.up span{grid-column:1;font-size:13px;color:var(--mute)}
.pips{grid-column:1;display:flex;gap:4px}
.pips i{width:20px;height:6px;border-radius:3px;background:#4a3420}
.pips i.on{background:var(--amber);box-shadow:0 0 8px rgba(255,179,71,.6)}
.buy{grid-column:2;grid-row:1 / span 3;font-family:var(--f-display);font-size:13px;border:0;border-radius:999px;padding:9px 14px;color:#2a1408;background:var(--amber);cursor:pointer;white-space:nowrap}
.buy[disabled]{background:#4a3420;color:#9a8460;cursor:default}
.part{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;border:1px dashed var(--line);border-radius:14px;padding:10px 14px}
.part i{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff4c8,#e0b062 55%,#6a4210);box-shadow:0 0 16px rgba(224,176,98,.5)}
.part.off i{filter:grayscale(1) brightness(.4);box-shadow:none}
.part span{font-size:13px;color:var(--mute)}
.res h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0;text-align:center;color:var(--amber);text-shadow:0 0 18px rgba(255,179,71,.5)}
.stars{font-size:44px;letter-spacing:8px;color:#4a3420;text-align:center}
.stars b{color:var(--amber);text-shadow:0 0 16px rgba(255,179,71,.8);display:inline-block;animation:pop .4s both}
.stars b:nth-child(2){animation-delay:.25s}.stars b:nth-child(3){animation-delay:.5s}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.stats{display:grid;grid-template-columns:auto auto;gap:6px 18px;font-size:15px}
.stats span{color:var(--mute)}
.stats b{text-align:right;font-variant-numeric:tabular-nums}
.stats b.m1{color:#d8955a}.stats b.m2{color:#dfe4f0}.stats b.m3{color:#ffd860}
.note{max-width:36ch;text-align:center;font-size:14px;color:var(--cream);background:rgba(224,176,98,.12);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0}
.tut{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(6,3,1,.74)}
.tut[hidden]{display:none}
.tut .card{width:100%;max-width:340px;background:linear-gradient(180deg,#2e1a0c,#1c0f06);border:1px solid var(--line);border-radius:18px;padding:20px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.tut h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;color:var(--amber)}
.tut p{margin:0;font-size:15px;line-height:1.45;color:var(--cream)}
.tut .dots{display:flex;gap:6px}.tut .dots i{width:8px;height:8px;border-radius:50%;background:#4a3420}.tut .dots i.on{background:var(--amber)}
.tut svg{width:120px;height:72px}
.tut .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#s-shop{background:radial-gradient(circle, rgba(255,220,170,.07) 1.3px, transparent 1.8px) 0 0/18px 18px, linear-gradient(180deg,#1e1b18,#0d0b09)}
#s-shop .bar h2{color:#ffd9a0}
.sec{width:100%;max-width:460px;margin:6px 0 -6px;font-family:var(--f-display);font-size:12px;letter-spacing:.16em;color:var(--teal)}
#s-shop .shop{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
#s-shop .up{grid-template-columns:58px minmax(0,1fr);gap:6px 14px;background:linear-gradient(180deg,#2c2824,#1b1815);border:1px solid #4a4038;border-radius:16px;padding:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 6px 16px rgba(0,0,0,.45)}
#s-shop .up.maxed{border-color:#a08038;background:linear-gradient(180deg,#34291a,#1d170f)}
#s-shop .up .ic{grid-row:1 / span 3;width:58px;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#6a5638,#2a2016);border:1px solid #8a6a40;box-shadow:inset 0 2px 8px rgba(0,0,0,.55)}
#s-shop .up .ic svg{width:36px;height:36px}
#s-shop .up b{grid-column:2;font-size:16px;color:#fff1d8}
#s-shop .up span{grid-column:2;font-size:13px;line-height:1.35;color:#c8b898}
#s-shop .up .foot{grid-column:2;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
#s-shop .up .pips{grid-column:auto}
#s-shop .up .buy{grid-column:auto;grid-row:auto;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 14px}
#s-shop .up .buy i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff0c0,#d8a64a 60%,#7a4a12);display:inline-block}
#s-shop .up .buy[disabled] i{filter:grayscale(1) brightness(.6)}
#s-shop .part{background:rgba(255,255,255,.02)}
.row2{display:flex;gap:10px;justify-content:center;width:100%;max-width:340px}
.row2 .btn{min-width:0;flex:1 1 0;padding:12px 8px;font-size:15px}
.btn.two{display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.1}
.btn.two small{font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.01em;color:var(--teal)}
.btn[disabled]{opacity:.5;cursor:default}
.achs{width:100%;max-width:460px;display:flex;flex-direction:column;gap:8px}
.ach{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;background:linear-gradient(180deg,#2c2824,#1b1815);border:1px solid #4a4038;border-radius:14px;padding:10px 12px}
.ach i{font-style:normal;font-size:20px;color:#5a4a38;text-align:center}
.ach b{display:block;font-size:14px;color:#c8b898}
.ach span{display:block;font-size:12px;line-height:1.35;color:var(--mute)}
.ach em{font-style:normal;font-family:var(--f-display);font-size:11px;color:#8a7858;white-space:nowrap}
.ach.on{border-color:#a08038;background:linear-gradient(180deg,#34291a,#1d170f)}
.ach.on i{color:#ffd860}.ach.on b{color:#fff1d8}.ach.on em{color:var(--teal)}
#s-ach{background:radial-gradient(circle, rgba(255,220,170,.07) 1.3px, transparent 1.8px) 0 0/18px 18px, linear-gradient(180deg,#1e1b18,#0d0b09)}
#splash{position:fixed;inset:0;z-index:9998;background:#0b0604;transition:opacity .45s ease}
#splash.out{opacity:0;pointer-events:none}
#splash canvas{display:block;width:100%;height:100%}
#pauseBtn{position:absolute;top:8px;right:max(8px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(20,10,4,.7);color:var(--cream);font-family:var(--f-display);font-size:14px;cursor:pointer;z-index:2}
@media (prefers-reduced-motion: reduce){.stars b{animation:none}}
</style>

<div id="rotate"><div class="ph"></div><p>Gire o celular<br>para a vertical</p></div>
<div id="splash" aria-hidden="true"><canvas></canvas></div>
<script>
/* Opening splash: a dark pinball table. The plunger fires the ball, it rattles the three bumpers, drops to the left flipper
   and is shot into the top target, which switches the backglass (the logo) on. It runs on its own canvas above everything
   and removes itself; a tap skips it. frame(ctx,w,h,0) is also the native splash image. */
(() => {
  const el = document.getElementById('splash'), cv = el.firstChild, x = cv.getContext('2d');
  const TAU = Math.PI*2, cl = v => v < 0 ? 0 : v > 1 ? 1 : v, ease = v => 1 - Math.pow(1 - cl(v), 3);
  const AMB = '255,179,71', CRM = '243,230,196', TH = 2.0;
  const BUMP = [[-.095, 0, '255,120,220', 1.0], [.09, -.02, '90,240,255', 1.17], [.04, .09, '255,230,90', 1.32]];
  // ball path: [t0, t1, from, control (or null), to, ease power]
  const PATH = [
    [.35, .6, [.186, .352], null, [.186, -.05], 1],
    [.6, 1.0, [.186, -.05], [.17, -.21], [-.07, -.042], 1],
    [1.0, 1.17, [-.07, -.042], [0, -.085], [.041, -.02], 1],
    [1.17, 1.32, [.041, -.02], [0, 0], [.03, .042], 1.3],
    [1.32, 1.72, [.03, .042], [-.08, .03], [-.055, .307], 1.7],
    [1.72, TH, [-.055, .307], null, [0, -.146], 1]];
  const pull = t => t < .05 ? 0 : t < .33 ? .03*ease((t - .05)/.28) : t < .37 ? .03*(1 - (t - .33)/.04) : 0;
  function ballAt(t){
    if(t <= .35) return [.186, .352 + pull(t)];
    for(const s of PATH) if(t <= s[1]){
      const f = Math.pow(cl((t - s[0])/(s[1] - s[0])), s[5]), a = s[2], q = s[3], b = s[4], g = 1 - f;
      return q ? [g*g*a[0] + 2*g*f*q[0] + f*f*b[0], g*g*a[1] + 2*g*f*q[1] + f*f*b[1]] : [a[0] + (b[0] - a[0])*f, a[1] + (b[1] - a[1])*f];
    }
    return [0, -.146];
  }
  function frame(c, w, h, t){
    const U = Math.min(h, w/.44), cx = w/2, cy = h/2 - U*.008, px = v => v*U, X = v => cx + v*U, Y = v => cy + v*U;
    const tb = t - TH, on = tb > 0, flick = !on ? 0 : tb < .05 ? 1 : tb < .1 ? .2 : tb < .16 ? 1 : tb < .21 ? .45 : 1;
    const live = on ? flick*(.88 + .12*Math.sin(t*6)) : 0;
    c.fillStyle = '#0b0604'; c.fillRect(0, 0, w, h);
    let g = c.createRadialGradient(cx, Y(.1), 0, cx, Y(.1), px(.5));
    g.addColorStop(0, `rgba(96,52,20,${.26 + .16*live})`); g.addColorStop(1, 'rgba(11,6,4,0)'); c.fillStyle = g; c.fillRect(0, 0, w, h);

    // table body
    const body = () => { c.beginPath(); c.moveTo(X(-.2), Y(.4)); c.lineTo(X(-.2), Y(-.05)); c.bezierCurveTo(X(-.2), Y(-.21), X(.205), Y(-.21), X(.205), Y(-.05)); c.lineTo(X(.205), Y(.4)); c.closePath(); };
    body(); g = c.createLinearGradient(0, Y(-.17), 0, Y(.4)); g.addColorStop(0, '#1d0f08'); g.addColorStop(1, '#120905'); c.fillStyle = g; c.fill();
    c.save(); body(); c.clip();
    g = c.createRadialGradient(X(0), Y(.02), 0, X(0), Y(.02), px(.3)); g.addColorStop(0, `rgba(${AMB},${.05 + .09*live})`); g.addColorStop(1, `rgba(${AMB},0)`); c.fillStyle = g; c.fillRect(X(-.21), Y(-.2), px(.42), px(.62));
    c.restore();
    body(); c.lineWidth = px(.006); c.strokeStyle = `rgba(${AMB},${.5 + .5*live})`; c.stroke();
    // plunger lane wall, guides, slingshots
    c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = px(.0045); c.strokeStyle = `rgba(${CRM},.5)`;
    c.beginPath(); c.moveTo(X(.168), Y(.4)); c.lineTo(X(.168), Y(-.03)); c.stroke();
    for(const s of [-1, 1]){
      c.beginPath(); c.moveTo(X(s*.152), Y(.2)); c.lineTo(X(s*.152), Y(.262)); c.lineTo(X(s*.108), Y(.297)); c.stroke();
      c.beginPath(); c.moveTo(X(s*.122), Y(.19)); c.lineTo(X(s*.122), Y(.245)); c.lineTo(X(s*.082), Y(.272)); c.closePath();
      c.fillStyle = `rgba(90,240,255,${.07 + .16*live})`; c.fill(); c.strokeStyle = `rgba(90,240,255,${.45 + .5*live})`; c.stroke(); c.strokeStyle = `rgba(${CRM},.5)`;
    }
    // insert arrows up the middle: they chase once the table is lit, and light as the last shot passes
    for(let i = 0; i < 4; i++){
      const iy = .262 - i*.036, shot = t > 1.72 + i*.035 && !on ? cl(1 - (t - 1.72 - i*.035)/.3) : 0, a = on ? (Math.floor(t*9) % 4 === i ? 1 : .35)*flick : shot;
      c.beginPath(); c.moveTo(X(0), Y(iy - .013)); c.lineTo(X(.012), Y(iy + .009)); c.lineTo(X(-.012), Y(iy + .009)); c.closePath();
      c.fillStyle = `rgba(${AMB},${.13 + .87*a})`; c.fill();
    }
    for(const s of [-1, 0, 1]){ c.beginPath(); c.arc(X(s*.062), Y(-.108 + Math.abs(s)*.012), px(.0075), 0, TAU); c.fillStyle = `rgba(255,230,90,${.14 + .86*live})`; c.fill(); }
    // top target
    const hit = on ? cl(1 - tb/.5) : 0;
    c.beginPath(); c.moveTo(X(-.032), Y(-.163)); c.lineTo(X(.032), Y(-.163)); c.lineWidth = px(.008); c.strokeStyle = `rgba(${CRM},${.4 + .6*Math.max(hit, live)})`; c.stroke();

    // bumpers
    for(const b of BUMP){
      const fl = t >= b[3] ? cl(1 - (t - b[3])/.4) : 0, a = Math.max(fl, live*.8), bx = X(b[0]), by = Y(b[1]), r = px(.034)*(1 + .1*fl);
      if(a > 0){ g = c.createRadialGradient(bx, by, 0, bx, by, r*2.6); g.addColorStop(0, `rgba(${b[2]},${.4*a})`); g.addColorStop(1, `rgba(${b[2]},0)`); c.fillStyle = g; c.fillRect(bx - r*2.6, by - r*2.6, r*5.2, r*5.2); }
      c.beginPath(); c.arc(bx, by, r, 0, TAU); c.fillStyle = `rgba(${b[2]},${.1 + .3*a})`; c.fill(); c.lineWidth = px(.0055); c.strokeStyle = `rgba(${b[2]},${.4 + .6*a})`; c.stroke();
      c.beginPath(); c.arc(bx, by, r*.52, 0, TAU); c.fillStyle = `rgba(${b[2]},${.22 + .78*a})`; c.fill();
      c.beginPath(); c.arc(bx, by, r*.2, 0, TAU); c.fillStyle = `rgba(255,255,255,${.25 + .7*a})`; c.fill();
      if(fl > 0 && t - b[3] < .4){ const k = (t - b[3])/.4; c.beginPath(); c.arc(bx, by, r*(1 + 1.5*ease(k)), 0, TAU); c.lineWidth = px(.004); c.strokeStyle = `rgba(${b[2]},${.7*(1 - k)})`; c.stroke();
        c.globalAlpha = 1 - k; c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = '700 ' + px(.021) + 'px "Chakra Petch", "Segoe UI", sans-serif'; c.fillStyle = '#fff'; c.fillText('100', bx, by - r*1.5 - px(.03)*ease(k)); c.globalAlpha = 1; }
    }

    // flippers: the left one fires the last shot
    const REST = .5, la = t < 1.69 ? REST : t < 1.73 ? REST - (t - 1.69)/.04 : t < 1.95 ? REST - 1 : t < 2.1 ? REST - 1 + (t - 1.95)/.15 : REST;
    for(const s of [-1, 1]){
      const a = s < 0 ? la : REST, fx = X(s*.105), fy = Y(.3), L = px(.086), r0 = px(.015), r1 = px(.0085);
      c.save(); c.translate(fx, fy); c.scale(-s, 1); c.rotate(a);
      c.beginPath(); c.arc(0, 0, r0, Math.PI/2, -Math.PI/2); c.lineTo(L, -r1); c.arc(L, 0, r1, -Math.PI/2, Math.PI/2); c.closePath();
      c.shadowColor = `rgba(${AMB},.55)`; c.shadowBlur = px(.012); c.fillStyle = '#ffb347'; c.fill(); c.shadowBlur = 0;
      c.beginPath(); c.arc(0, 0, r0*.42, 0, TAU); c.fillStyle = '#5a2a10'; c.fill();
      c.restore();
    }
    // plunger
    const pl = pull(t), py = Y(.368 + pl);
    c.lineWidth = px(.004); c.strokeStyle = `rgba(${CRM},.55)`; c.beginPath();
    for(let i = 0; i <= 6; i++){ const yy = py + px(.008) + (Y(.4) - py - px(.008))*i/6; c.lineTo(X(.186 + (i % 2 ? .009 : -.009)), yy); } c.stroke();
    c.fillStyle = '#f3e6c4'; c.fillRect(X(.174), py, px(.024), px(.007));

    // ball
    if(!on){
      for(let j = 9; j >= 1; j--){ const q = ballAt(t - j*.011); if(t - j*.011 < .35) continue; c.fillStyle = `rgba(255,224,176,${.05*(10 - j)})`; c.beginPath(); c.arc(X(q[0]), Y(q[1]), px(.0125)*(1 - j*.06), 0, TAU); c.fill(); }
      const b = ballAt(t), bx = X(b[0]), by = Y(b[1]), r = px(.0138); g = c.createRadialGradient(bx - r*.35, by - r*.35, r*.1, bx, by, r);
      g.addColorStop(0, '#ffffff'); g.addColorStop(.4, '#d5d8dc'); g.addColorStop(1, '#5c626b'); c.fillStyle = g; c.beginPath(); c.arc(bx, by, r, 0, TAU); c.fill();
    }
    // the hit on the top target
    if(on && tb < .6){
      const k = tb/.6, ox = X(0), oy = Y(-.16);
      g = c.createRadialGradient(ox, oy, 0, ox, oy, px(.16)); g.addColorStop(0, `rgba(255,240,190,${.75*(1 - k)})`); g.addColorStop(1, 'rgba(255,216,96,0)'); c.fillStyle = g; c.fillRect(ox - px(.16), oy - px(.16), px(.32), px(.32));
      c.lineWidth = px(.004); c.strokeStyle = `rgba(255,236,170,${.9*(1 - k)})`; c.beginPath();
      for(let i = 0; i < 12; i++){ const a = i*TAU/12, r0 = px(.02 + .05*ease(k)), r1 = px(.035 + .13*ease(k)); c.moveTo(ox + Math.cos(a)*r0, oy + Math.sin(a)*r0); c.lineTo(ox + Math.cos(a)*r1, oy + Math.sin(a)*r1); } c.stroke();
    }

    // backglass with the logo: dark until the target is hit
    const gx = -.19, gy = -.455, gw = .38, gh = .235;
    c.beginPath(); c.roundRect(X(gx), Y(gy), px(gw), px(gh), px(.02)); c.fillStyle = '#140a06'; c.fill();
    if(on){ g = c.createRadialGradient(X(0), Y(gy + gh/2), 0, X(0), Y(gy + gh/2), px(.24)); g.addColorStop(0, `rgba(150,60,24,${.42*live})`); g.addColorStop(1, 'rgba(150,60,24,0)'); c.save(); c.beginPath(); c.roundRect(X(gx), Y(gy), px(gw), px(gh), px(.02)); c.clip(); c.fillStyle = g; c.fillRect(X(gx), Y(gy), px(gw), px(gh)); c.restore(); }
    c.beginPath(); c.roundRect(X(gx), Y(gy), px(gw), px(gh), px(.02)); c.lineWidth = px(.005); c.strokeStyle = `rgba(${AMB},${.4 + .6*live})`; c.stroke();
    const bulbs = [], NX = 13, NY = 7, m = .016;
    for(let i = 0; i < NX; i++) bulbs.push([gx + m + (gw - 2*m)*i/(NX - 1), gy + m]);
    for(let i = 1; i < NY; i++) bulbs.push([gx + gw - m, gy + m + (gh - 2*m)*i/(NY - 1)]);
    for(let i = 1; i < NX; i++) bulbs.push([gx + gw - m - (gw - 2*m)*i/(NX - 1), gy + gh - m]);
    for(let i = 1; i < NY - 1; i++) bulbs.push([gx + m, gy + gh - m - (gh - 2*m)*i/(NY - 1)]);
    const step = Math.floor(t*11);
    bulbs.forEach((p, i) => { const a = on ? ((i + step) % 3 === 0 ? 1 : .32)*flick : 0; c.beginPath(); c.arc(X(p[0]), Y(p[1]), px(.0048), 0, TAU); c.fillStyle = `rgba(255,236,170,${.13 + .87*a})`; c.fill(); });
    const fs = px(.074), sc = 1 + .1*(on ? cl(1 - tb/.28) : 0), ly = gy + gh/2;
    c.save(); c.translate(X(0), Y(ly)); c.scale(sc, sc); c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = fs + 'px "Bungee Inline", "Bungee", Impact, sans-serif';
    if(flick < 1){ c.globalAlpha = 1 - flick; c.fillStyle = 'rgba(255,179,71,.16)'; c.fillText('TILT', 0, -px(.04)); c.fillStyle = 'rgba(243,230,196,.14)'; c.fillText('TOWER', 0, px(.043)); }
    if(flick > 0){ c.globalAlpha = flick;
      c.fillStyle = '#8a2a12'; c.fillText('TILT', px(.004), -px(.04) + px(.004));
      c.shadowColor = 'rgba(255,179,71,.7)'; c.shadowBlur = px(.022); c.fillStyle = '#ffb347'; c.fillText('TILT', 0, -px(.04)); c.shadowBlur = 0;
      c.fillStyle = '#2a6a60'; c.fillText('TOWER', px(.004), px(.043) + px(.004));
      c.shadowColor = 'rgba(255,220,170,.55)'; c.shadowBlur = px(.018); c.fillStyle = '#f3e6c4'; c.fillText('TOWER', 0, px(.043)); c.shadowBlur = 0; }
    c.restore(); c.globalAlpha = 1;
    const ta = cl((t - 2.45)/.35);
    if(ta > 0){ c.globalAlpha = ta; c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = '600 ' + px(.019) + 'px "Chakra Petch", "Segoe UI", sans-serif'; c.fillStyle = '#6fc7b8'; c.fillText('S U B A   A   T O R R E', cx, Y(.445)); c.globalAlpha = 1; }
  }
  window.__ttSplash = frame;
  /* Sound: its own small audio context, cues fired from the animation clock. Browsers keep it muted until the page has
     been touched, so on the web it may stay silent; inside the app it plays. The game's sound switch is respected. */
  let ac = null, out = null, nb = null, cue = 0, mute = false;
  try { const sv = JSON.parse(localStorage.getItem('tilttower.save.v1') || '{}'); mute = sv.sound === false; } catch(e){}
  const tone = (f, at, dur, vol, type, f1) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, at); if(f1) o.frequency.exponentialRampToValueAtTime(f1, at + dur);

  const pop = f => at => { noise(at, .05, .5, 1800, .8); tone(150, at, .11, .5, 'sine', 55); bell(f, at, .22, .45); };
  const CUES = [
    [.35, at => { noise(at, .07, .6, 900, .7); tone(110, at, .12, .5, 'triangle', 50); noise(at + .03, .26, .16, 2600, 2.5); }],   // plunger
    [1.0, pop(784)], [1.17, pop(988)], [1.32, pop(1175)],                                                                         // bumpers
    [1.7, at => { noise(at, .04, .7, 1300, .9); tone(190, at, .08, .5, 'square', 70); }],                                         // flipper
    [TH, at => { noise(at, .3, .35, 3200, .6); tone(90, at, .4, .55, 'sine', 40); [523, 659, 784, 1047, 1319].forEach((f, i) => bell(f, at + .02 + i*.075, .2, .7)); [523, 784, 1047].forEach(f => bell(f, at + .46, .16, 1.1)); }]];
  function audio(){
    if(mute) return;
    try { const AC = window.AudioContext || window.webkitAudioContext; ac = new AC(); out = ac.createGain(); out.gain.value = .5; out.connect(ac.destination);
      const n = ac.sampleRate >> 1, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0); for(let i = 0; i < n; i++) d[i] = Math.random()*2 - 1; nb = b;
      if(ac.state === 'suspended') ac.resume().catch(() => {}); } catch(e){ ac = null; }
  }
  // a cue that is already more than a tenth of a second late is dropped, so nothing piles up when audio wakes late
  const cues = t => { while(cue < CUES.length && t >= CUES[cue][0]){ if(ac && ac.state === 'running' && t - CUES[cue][0] < .1) try { CUES[cue][1](ac.currentTime + .005); } catch(e){} cue++; } };
  const hush = () => { if(!ac) return; const a = ac; ac = null; try { out.gain.setTargetAtTime(0, a.currentTime, .12); } catch(e){} setTimeout(() => { try { a.close(); } catch(e){} }, 1600); };
  let w = 0, h = 0, dpr = 1, t0 = null, done = false, skipped = false;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches, end = still ? 1 : 3.6;
  const fit = () => { dpr = Math.min(2, window.devicePixelRatio || 1); w = el.clientWidth || innerWidth; h = el.clientHeight || innerHeight; cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); };
  const paint = t => { x.setTransform(dpr, 0, 0, dpr, 0, 0); frame(x, w, h, still ? 9 : t); };
  const close = () => { if(done) return; done = true; el.classList.add('out'); removeEventListener('resize', fit); setTimeout(() => el.remove(), 480); if(skipped) hush(); else setTimeout(hush, 1200); };
  const loop = ts => { if(done) return; if(t0 === null) t0 = ts; const t = (ts - t0)/1000; paint(t); cues(t); if(t > end) close(); else requestAnimationFrame(loop); };
  fit(); addEventListener('resize', fit); paint(0); if(!still) audio();
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); skipped = true; close(); });
  requestAnimationFrame(loop); setTimeout(close, (end + 1.5)*1000);   // the timer also closes it where animation frames do not run
})();

  else if(G.nudges.length === 2) popup('CUIDADO!', 180, b.y-40, C.red);

/* =========================================================
   FRAME UPDATE
   ========================================================= */
function update(dt){
  G.t += dt;
  const L = G.L, b = G.ball;
  if(!L) return;
  if(G.paused) return;
  if(G.mode==='bonus'){
    bonusUpdate(dt); cosUpdate(dt);
    for(const p of G.parts){ p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 600*dt; } G.parts = G.parts.filter(p=>p.t<p.life);
    for(const p of G.popups){ p.t += dt; p.y -= 30*dt; } G.popups = G.popups.filter(p=>p.t<p.life);
    return;
  }
  // attract autopilot
  if(G.mode==='attract'){
    for(const F of L.flippers){
      const key = F.side>0?'L':'R';
      if(G.autoT[key] > 0) G.autoT[key] -= dt;
      const mx = F.px + F.side*F.len*.55;
      if(Math.abs(b.x-mx) < 46 && b.y < F.py+6 && b.y > F.py-46 && b.vy > -80 && G.autoT[key] <= 0 && Math.random()<.5) G.autoT[key] = .2;
    }
    if(G.inPlunger){ G.autoLaunchT -= dt; if(G.autoLaunchT <= 0){ launch(); G.autoLaunchT = 1; } }
  } else if(G.autoLaunchT > 0 && G.inPlunger){ G.autoLaunchT -= dt; if(G.autoLaunchT <= 0) launch(); }

  if(G.mode==='play' || G.mode==='attract'){
    const ts = slowScale(); if(G.slowT > 0){ G.slowT -= dt; if(G.slowT <= .7 && !G.slowUp){ G.slowUp = true; Snd.tone(140,.9,'sine',.07,520); } }
    G.acc = Math.min((G.acc||0) + dt*ts, STEP*16);
    while(G.acc >= STEP){ physStep(STEP); G.acc -= STEP; }
  }
  if(G.saveT > 0 && !b.rail) G.saveT -= dt;
  for(const F of L.flippers){ if(F.frozen > 0) F.frozen -= dt; F.lit = Math.max(0, F.lit-dt*3); }
  for(const c of L.bumpers) c.flash = Math.max(0, c.flash-dt*3.5);
  for(const s of L.slings) s.flash = Math.max(0, s.flash-dt*5);
  for(const e of L.enemies) e.flash = Math.max(0, e.flash-dt*4);
  for(const k of L.kickers) k.fire = Math.max(0, k.fire-dt*3);
  for(const t of L.stands) t.flash = Math.max(0, t.flash-dt*3);
  for(const cd of L.codes){ cd.flash = Math.max(0, cd.flash-dt*1.2); cd.err = Math.max(0, cd.err-dt*2.4); for(const t of cd.btns) t.flash = Math.max(0, t.flash-dt*2.4); }
  for(const pt of L.portals){ pt.flash = Math.max(0, pt.flash-dt*1.8); pt.ph += dt*3; }
  for(const bk of L.banks){ bk.flash = Math.max(0, bk.flash-dt*1.5); bk.targets.forEach(t=>t.fall=Math.max(0,t.fall-dt*4)); }
  for(const s of L.spinners){
    s.ang += s.vel*dt; s.acc += s.vel*dt; s.vel *= Math.exp(-dt*1.3);
    while(s.acc > Math.PI){ s.acc -= Math.PI; s.revs++; addScore(10, (s.x1+s.x2)/2, s.y-10, true); SFX.spin(); if(s.revs % 4 === 0) addFichas(1, (s.x1+s.x2)/2, s.y-20); }
  }
  for(const ln of L.lanes){
    ln.flash = Math.max(0, ln.flash-dt*2);
    if(ln.reset > 0){ ln.reset -= dt; if(ln.reset <= 0) ln.lit = [0,0,0,0]; }
    else if(ln.lit.every(v=>v)){ ln.ever = true; ln.flash = 1; ln.reset = 1.2; G.bonusX = Math.min(5, G.bonusX+1); comboHit(180, ln.y+30); addScore(1000, 180, ln.y+30); popup(`${ln.letters.split('').join('-')}! BÔNUS x${G.bonusX}`, 180, ln.y+60, C.gold, 1.6); SFX.rampDone(); G.gi = .8; }
  }
  // locks & exit
  for(const r of L.rails){
    if(r.lockBy==='bank') r.locked = !r.lockObj.cleared;
    else if(r.lockBy==='roll') r.locked = !r.lockObj.ever;
    else if(r.lockBy==='dance') r.locked = !r.lockObj.cleared;
    else if(r.lockBy==='code') r.locked = !r.lockObj.cleared;
    if(r.gate) r.gate.on = r.locked;
  }
  if(L.exit && L.goalCond!=='boss'){
    if(L.goalCond==='targets') L.exit.lit = L.goalStands.every(t=>t.lit);
    if(L.goalCond==='bank') L.exit.lit = L.goalBank.cleared;
  }
  bossUpdate(dt);
  enemyShots(dt);
  curseUpdate(dt);
  sigUpdate(L, dt);
  danceUpdate(L, dt);
  beltUpdate(L, dt);
  for(const tt of L.turntables) if(tt.on) tt.ang += tt.w*tt.dir*dt;
  if(G.midT > 0) G.midT -= dt; if(G.turboCool > 0) G.turboCool -= dt; if(G.midCool > 0) G.midCool -= dt;
  // quest: key and vault
  const Q = L.quest;
  if(Q){
    if(Q.msgT > 0) Q.msgT -= dt; if(Q.open) Q.openT += dt;
    const k = Q.key; k.ph += dt;
    if(!k.taken && G.mode==='play' && Math.hypot(b.x-k.x, b.y-k.y) < BR+12){
      k.taken = true; SFX.gold(); Snd.chime(0); Snd.chime(1,.12); sparks(k.x, k.y, C.gold, 22); G.gi = .8;
      popup('CHAVE!', k.x, k.y-30, C.gold, 1.6); popup('ABRA O COFRE', 180, k.y-56, C.cream, 2);
    }
  }
  // coins & magnet
  const mr = 20 + S.up.magnet*16;
  for(const c of L.coins){
    if(c.taken) continue;
    const dx = b.x-c.x, dy = b.y-c.y, d = Math.hypot(dx,dy);
    if(d < BR+9){ c.taken = true; if(c.gold){ G.golds++; addFichas(10, c.x, c.y); comboHit(c.x, c.y); addScore(1000, c.x, c.y-20); SFX.gold(); sparks(c.x,c.y,C.gold,20); popup(`FICHA DOURADA ${G.golds}/3`, c.x, c.y-46, C.gold, 1.6); } else { addFichas(1, c.x, c.y); addScore(25, c.x, c.y, true); SFX.coin(); sparks(c.x,c.y,C.gold,6); } }
    else if(d < mr + BR && G.mode==='play'){ c.x += dx/d*Math.min(d, 260*dt); c.y += dy/d*Math.min(d, 260*dt); }
  }
  if(G.mode==='play' && !b.rail && !b.held && !G.done){ const fN = clamp(floorOf(b.y),0,L.n-1); if(G.lastFloor===undefined) G.lastFloor = fN; if(fN !== G.lastFloor){ G.lastFloor = fN; if(!(G.slowT > 0)) startSlow(); if(S.up.floorkick && G.mode==='play'){ G.floorKick[fN] = 1; popup('EMPURRÃO VIAJANTE', 180, b.y-50, C.gold, 1.2); } } }
  { const fNow = clamp(floorOf(b.y),0,L.n-1), flo = L.floors[fNow];
    if(flo && !flo.reached && !b.rail && !b.held){ flo.reached = true; if(G.mode==='play'){ addScore(2000, 180, b.y-60); G.floorMsg = { text:`ANDAR ${fNow+1}`, t:0 }; lightWave(); SFX.rampDone(); } } }
  // endless-bounce watchdog: a ball that stays 15 s in the upper half of a floor (no rail, no saucer) gets a small shove down
  if(G.mode==='play' && !b.rail && !b.held && !G.inPlunger && lyOf(b.y) < 430){ G.highT = (G.highT||0) + dt; if(G.highT > 15){ G.highT = 0; b.vx += (Math.random()-.5)*320; b.vy += 220; } } else G.highT = 0;
  // ball search for a stuck ball
  const cradled = L.flippers.some(F => G.press[F.side>0?'L':'R'] && Math.hypot(b.x-(F.px+F.side*F.len*.4), b.y-F.py) < 50);
  if(!G.anchor || b.rail || b.held || G.inPlunger || cradled || G.freeze || Math.hypot(b.x-G.anchor.x, b.y-G.anchor.y) > 10){ G.anchor = { x:b.x, y:b.y }; G.stillT = 0; }
  else { G.stillT += dt; if(G.stillT > 2.5){ b.vx = (Math.random()-.5)*500; b.vy = -480; G.stillT = 0; G.anchor = null; SFX.relay(); G.searches = (G.searches||0)+1;
      const ls = G.lastSearch; if(ls && G.t - ls.t < 8 && Math.hypot(b.x-ls.x, b.y-ls.y) < 60){ const fS = clamp(floorOf(b.y),0,L.n-1); b.x = 180; b.y = Y(fS,520); b.vx = (Math.random()-.5)*240; b.vy = -260; G.lastSearch = null; popup('BOLA SOLTA', 180, b.y-40, C.cream, 1.2); } else G.lastSearch = { x:b.x, y:b.y, t:G.t }; } }
  // ball cosmetics
  cosUpdate(dt);
  for(const eb of (G.extra||[])){ rollBall(eb, dt); spinBall(eb, dt); }
  if(G.multi){ G.multi.t += dt; if(!(G.extra && G.extra.length)){ G.multi = null; popup('FIM DO MULTIBALL', 180, b.y-50, C.cream, 1.4); Music.set(L.boss && L.boss.intro && !L.boss.dead ? 'boss' : 'play'); } }
  rollBall(b, dt); spinBall(b, dt); if(b.sqT > 0) b.sqT -= dt;
  b.trail.unshift([b.x,b.y]); if(b.trail.length > 7) b.trail.pop();
  // camera
  const mf = G.multi ? G.multi.f : -1;
  const target = mf >= 0 ? (view.vh >= FH ? Y(mf, FH/2) - view.vh/2 : Y(mf, FH) + 16 - view.vh) : clamp(b.y - view.vh*.58, Y(L.n-1,0)-100, FH+20-view.vh);
  if(!isFinite(G.cam)) G.cam = target;
  G.cam += (target-G.cam)*Math.min(1, dt*(b.rail?7:4.5));
  G.shake = Math.max(0, G.shake - dt*20);
  G.gi += (1-G.gi)*Math.min(1, dt*4); if(G.tilt) G.gi = .45;
  for(const p of G.parts){ p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 600*dt; }
  G.parts = G.parts.filter(p=>p.t<p.life);
  for(const p of G.popups){ p.t += dt; p.y -= 30*dt; }
  G.popups = G.popups.filter(p=>p.t<p.life);
  if(G.banner){ G.banner.t += dt; if(G.banner.t > G.banner.dur && !(G.inPlunger && G.banner.title.startsWith('FASE'))) G.banner = null; }
  if(G.floorMsg){ G.floorMsg.t += dt; if(G.floorMsg.t > 1.8) G.floorMsg = null; }
  if(G.done){ G.doneT += dt; if(G.doneT > 1.4 && G.mode==='play'){ if(G.sp && G.sp.kind==='endless') endlessNext(); else if(!G.sp && !G.bonusDone && Math.random() < .1){ G.bonusDone = true; startBonus(); } else startTally('win'); } }
  updateTally(dt); achUpdate(dt);
  if(G.combo && G.combo.n > 1 && G.t - G.combo.last > 5){ G.combo.n = 1; }
  reels(dt); Snd.frame(dt);
}

/* ---- static floor art (cached per floor) ---- */
function renderStatic(L){
  const res = Math.min(2.2, view.scale*view.dpr);
  L.static = [];
  for(let f=0; f<L.n; f++){
    const c = document.createElement('canvas'); c.width = Math.round(W*res); c.height = Math.round(FH*res);
    const x = c.getContext('2d'); x.scale(res,res);
    drawFloorArt(x, L, f);
    x.translate(0, f*FH);
    drawFloorStatics(x, L, f);
    L.static.push(c);
  }
}
function drawFloorArtBase(x, L, f){

  x.beginPath(); x.arc(180, 300, 150, 0, TAU); x.fill();

  const rx = f===0 ? 322 : 352;

  x.fillStyle = 'rgba(243,230,196,.85)'; x.font = '700 9px "Chakra Petch", sans-serif'; x.textAlign = 'center';
  x.save(); x.translate(40,676); x.fillText(`ANDAR ${f+1}`, 0, 0); x.restore();
  x.save(); x.translate(320,676); x.fillText(f===L.n-1 ? 'TOPO' : 'SUBA!', 0, 0); x.restore();
  // drain-gap warning print
  x.fillStyle = 'rgba(217,68,58,.18)'; x.beginPath(); x.moveTo(150,668); x.lineTo(210,668); x.lineTo(204,700); x.lineTo(156,700); x.fill();
  // printed title on the ground floor
  if(f===0){ x.globalAlpha = .16; x.fillStyle = '#f3e6c4'; x.font = '26px "Bungee Inline", Bungee, sans-serif'; x.fillText('TILT TOWER', 180, 470); x.globalAlpha = 1; }
  printDecor(x, L, f);

  const st = this.state, sg = this.song(), bi = Math.floor(step/16) % sg.bars.length, bar = sg.bars[bi], s = step % 16;
  const full = st==='play' || st==='boss', p = bar.p, tr = bar.tr||0, ch = CH3[bar.c].map(n=>n+tr), root = BR3[bar.c]+tr, spb = 60/this.bpm()/4, barLen = spb*16;
  this.setLeslie(false);
  if(p==='end'){
    if(s===0){ this.kick(at, .65); this.crash(at, .16); this.gsnare(at, .3); this.hit({ at, f:mtof(root), d:2, type:'sawtooth', v:.12, lp:500 }); for(const nn of ch) for(const dt of [-10,10]) this.hit({ at, f:mtof(nn), d:2.6, a:.05, type:'sawtooth', v:.012, detune:dt, lp:2400, lp2:600, pan:dt<0?-.4:.4, rev:.5 }); }
    return;
  }
  /* drums: LinnDrum-style with gated snare */
  const drumsOn = !(p==='intro' && bi < 4);
  if(drumsOn){
    if(p==='brk'){ if(s===0 || s===8) this.kick(at, .55); if(s===12) this.gsnare(at, .3); }
    else { if(s===0 || s===8 || (s===10 && p!=='V') || (s===6 && p==='C')) this.kick(at, full ? .6 : .4); if(s===4 || s===12) this.gsnare(at, full ? .3 : .16); }
    if(s%2===0) this.nz(at, .03, s%4===0 ? .028 : .045, { hp:8000, pan:.3 }); else if(full && p!=='brk') this.nz(at, .02, .015, { hp:9000, pan:.3 });
  } else if(bi >= 2 && s%2===0) this.nz(at, .03, .025, { hp:8000, pan:.3 });
  if(bar.first && s===0 && full && p!=='intro') this.crash(at, .11);
  if(bar.last && s>=8 && s%2===0 && full && (p==='pre' || p==='brk' || p==='intro')) this.tom(at, [260,220,180,140][(s-8)/2], .3);
  /* sequenced bass in sixteenths */
  if(!(p==='intro' && bi < 2) && (p!=='brk' || s%4===0)){
    const acc = s%2===0, nn = root + (s===14 && p!=='brk' ? 12 : 0);
    this.hit({ at, f:mtof(nn), d:spb*.9, type:'sawtooth', v:acc ? .12 : .075, lp:acc ? 950 : 620, lp2:220, q:5 });
    this.hit({ at, f:mtof(nn-12), d:spb*.8, type:'square', v:acc ? .05 : .03, lp:300 });
  }
  /* arpeggio with echo */
  if(p==='intro' || p==='V' || p==='solo' || p==='brk'){
    const nn = ch[[0,1,2,1][s%4]] + 12 + (Math.floor(s/4)%2 ? 12 : 0);
    const o = { at, f:mtof(nn), d:spb*.8, type:'square', v:p==='solo' ? .01 : .016, lp:2600, pan:(s%2 ? .35 : -.35) }; this.hit(o);
    if(s%4===0){ const e = Object.assign({}, o, { dest:this.delay, v:o.v*.5 }); e.music = true; Snd.voice(e); }
  }
  /* pads */
  if(s===0 && p!=='brk') for(const nn of ch) for(const dt of [-10,10]) this.hit({ at, f:mtof(nn), d:barLen*.98, a:.35, sus:true, type:'sawtooth', v:.006, detune:dt, lp:p==='C' ? 2600 : 1600, pan:dt<0?-.45:.45, rev:.35 });
  if(p==='brk' && s===0 && bi%2===0) for(const nn of ch) this.hit({ at, f:mtof(nn), d:barLen*1.95, a:.6, sus:true, type:'sawtooth', v:.007, detune:7, lp:1200, rev:.5 });
  /* synth brass stabs */
  if((p==='C' || p==='pre') && [0,3,6,10].includes(s)) ch.forEach(nn => this.hit({ at, f:mtof(nn+12), d:.16, a:.01, type:'sawtooth', v:.013, lp:1100, lp2:3400, pan:.2 }));
  if(!full) return;
  /* leads */
  if(p==='V' || p==='pre'){ for(const nt of bar.m) if(nt[0]===s){ const d = nt[2]*spb, t = at + this.hum(); const o = { at:t, f:mtof(nt[1]+tr), d:d+.08, a:.01, type:'square', v:.034*(.9+Math.random()*.2), lp:3000, vib:5, vibAmt:3, pan:-.1, rev:.3, sus:true }; this.hit(o); const e = Object.assign({}, o, { dest:this.delay, v:o.v*.45 }); e.music = true; Snd.voice(e); } }
  else if(p==='C'){ for(const nt of bar.m) if(nt[0]===s){ const d = nt[2]*spb, t = at + this.hum(), n = nt[1]+tr; this.hit({ at:t, f:mtof(n), d:d+.06, a:.01, type:'sawtooth', v:.042, lp:1400, lp2:3800, q:1.4, pan:.1, rev:.3, sus:true }); this.hit({ at:t, f:mtof(n-12), d:d+.06, a:.01, type:'square', v:.018, lp:1800, pan:-.1, sus:true }); } }
  else if(p==='solo'){ for(const nt of bar.m) if(nt[0]===s){ const d = nt[2]*spb, f = mtof(nt[1]), bend = nt[2] >= 4, from = bend ? mtof(nt[1]-2) : (this.lastSolo3 || f); this.lastSolo3 = f; const t = at + this.hum()*.5;
      this.hit({ at:t, f:from, f2:f, glide:bend ? .12 : .035, d:d+.05, a:.006, type:'sawtooth', v:.044, lp:3200, q:2, vib:5.5, vibAmt:bend ? 6 : 1, pan:.05, rev:.3, sus:true });
      this.hit({ at:t, f:from, f2:f, glide:bend ? .12 : .035, d:d+.05, a:.006, type:'square', detune:8, v:.016, lp:2200, sus:true }); } }
};

const RAVE = ['40,220,200','190,90,255','255,90,180','255,230,90'];
const HOLO = ['110,230,255','200,240,255','150,130,255','80,255,200'];
function bulbCol(era, i){ const k = ((i%4)+4)%4; return era===4 ? HOLO[k%2] : era===3 ? RAVE[k%2] : era===2 ? NEON[k%2] : era===1 ? DISCO[k] : C.warm; }

/* ---------- shared helpers ---------- */
function discCollide(B, b){
  for(const d of B.discs){
    if(G.t - d.born < .3) continue;   // just spat: must not shove the ball through a wall
      const imp = hitMoving(b, d.x, d.y, d.r, d.vx, d.vy, .4);
    if(imp > 600){ d.life = 0; addScore(100, d.x, d.y); sparks(d.x,d.y,C.cream,10); SFX.relay(); }
    else if(imp > 0){ const dx=b.x-d.x, dy=b.y-d.y, l=Math.hypot(dx,dy)||1; b.vx += -dy/l*320; b.vy += dx/l*320; SFX.relay(); }
  }
}
function fireAtFlippers(B, n, sx, sy, v){
  const fl = G.L.flippers.filter(F=>F.f===B.f);
  for(let k=0;k<n;k++){ const F = fl[(Math.floor(B.t)+k)%2], tx = F.px+F.side*F.len*.5, ty = F.py, d = Math.hypot(tx-sx,ty-sy); B.sparks.push({ x:sx, y:sy, vx:(tx-sx)/d*v, vy:(ty-sy)/d*v, life:6, F }); }
  SFX.spark();
}
function sparkStep(B, dt, b, col, msg, frz){
  for(const s of B.sparks){
    s.x += s.vx*dt; s.y += s.vy*dt; s.life -= dt;
    const dx = b.x-s.x, dy = b.y-s.y;
    if(dx*dx+dy*dy < (BR+9)**2){ s.life = 0; addScore(100, s.x, s.y); sparks(s.x,s.y,col,10); SFX.spark(); }
    const tx = s.F.px + s.F.side*s.F.len*.5;
    if(Math.hypot(s.x-tx, s.y-s.F.py) < 30){ s.life = 0; s.F.frozen = frz; SFX.freeze(); sparks(s.x,s.y,col,14); popup(msg, tx, s.F.py-40, col); }
  }
  B.sparks = B.sparks.filter(s=>s.life>0);
}

/* ---------- ERA 4 modules ---------- */
function modPortal(L,f){
  const pt = { f, a:{ x:96, y:Y(f,262) }, b:{ x:264, y:Y(f,262) }, cool:0, flash:0, ph:0 };
  L.portals.push(pt);
  addBumper(L,f,180,190,19); addPost(L,f,130,340,6); addPost(L,f,230,340,6);
  [[96,200],[264,200],[180,300]].forEach(p=>addCoin(L,f,...p));
  return pt;
}
function portalStep(b, L, h){
  for(const pt of L.portals){
    if(pt.cool > 0){ pt.cool -= h; continue; }
    for(const [src, dst] of [[pt.a, pt.b], [pt.b, pt.a]]){
      const dx = b.x-src.x, dy = b.y-src.y;
      if(dx*dx+dy*dy < 15*15){
        // the 4th trip in a row without touching a flipper drops the ball out of the portal instead of launching it (and pays nothing)
        pt.n = (G.lastFlipHit||-9) > (pt.last||-9) ? 1 : (pt.n||0) + 1; pt.last = G.t; const loop = pt.n > 3;
        b.x = dst.x; b.y = dst.y; const sp = Math.max(650, Math.hypot(b.vx,b.vy)); b.vx = (180-dst.x)/84*sp*.35*(.7 + Math.random()*.6); b.vy = loop ? 240 : -sp*.9;
        pt.cool = .7; pt.flash = 1; if(!loop){ comboHit(dst.x, dst.y); addScore(250, dst.x, dst.y-20); } sparks(src.x, src.y, RAVE[1], 12); sparks(dst.x, dst.y, RAVE[0], 12);
        Snd.tone(1200, .08, 'square', .04, 2400); Snd.tone(2400, .08, 'square', .03, 900, .09); return;
      }
    }
  }
}
function modCode(L,f){
  const cd = { f, btns:[], seq:[], step:0, cleared:false, flash:0, err:0, y:Y(f,300) };
  [[f===0?76:120,'255,70,70'],[f===0?140:180,'80,230,120'],[f===0?276:240,'90,150,255']].forEach(([x,col],i) => { const t = { x, y:Y(f,300), col, i, flash:0 }; addSeg(L,f,x-13,300-[5,-4,-5][i],x+13,300+[5,-4,-5][i],{kind:'code',ref:t,draw:false,r:4}); cd.btns.push(t); });
  codeShuffle(cd); L.codes.push(cd);
  sideBumpers(L,f,170,17);
  [[150,232],[210,232],[180,380]].forEach(p=>addCoin(L,f,...p));
  return cd;
}
function codeShuffle(cd){ cd.seq = [0,1,2].map(() => Math.floor(Math.random()*3)); cd.step = 0; }
function codeHit(t){
  const cd = G.L.codes.find(c => c.btns.includes(t)); if(!cd || t.flash > .5) return; t.flash = 1;
  if(cd.seq[cd.step] === t.i){
    cd.step++; cd.okT = G.t; addScore(150, t.x, t.y-16); Snd.tone(660 + cd.step*220, .1, 'square', .05);
    if(cd.step >= 3){ const first = !cd.cleared; cd.cleared = true; cd.flash = 1; comboHit(180, cd.y); addScore(2000, 180, cd.y-50); SFX.rampDone(); G.gi = .8; popup(first ? 'CÓDIGO CERTO! RAMPA ABERTA' : 'CÓDIGO CERTO!', 180, cd.y-70, RAVE[3], 1.6); codeShuffle(cd); }
  } else if(G.t - (cd.okT||-9) > .6){ cd.step = Math.max(0, cd.step-1); cd.err = 1; Snd.tone(180, .2, 'square', .05, 120); }   // wrong colour: one step back (not the whole code), and never right after a good hit
}

/* ---------- ERA 5 modules ---------- */
function modHolo(L,f){
  const bank = modDrop(L,f,4,300,116,32); bank.holo = { per:3.4, off:1.1 }; bank.solid = true;
  sideBumpers(L,f,170,17);

  return bank;
}
function holoStep(bk){ const solid = (G.t % bk.holo.per) < bk.holo.per - bk.holo.off; bk.solid = solid; for(const t of bk.targets) if(!t.down) t.seg.on = solid; }
function modWell(L,f){
  const w = { f, x:180, y:Y(f,268), r:130, k:900, ph:0 }; L.wells.push(w);
  addPost(L,f,180,268,8);

function wellStep(b, L, h){
  for(const w of L.wells){ const dx = w.x-b.x, dy = w.y-b.y, d = Math.hypot(dx,dy); if(d < w.r && d > 1){ const a = w.k*(1-d/w.r); b.vx += dx/d*a*h; b.vy += dy/d*a*h; } }
}

/* ---------- ERA 4/5 bosses ---------- */
function modBossE45(L,f,type,B){
  if(type==='pet'){ B.hp = B.maxhp = 4; B.state = 'sleep'; B.calls = 0; B.px = 180; B.py = Y(f,112); B.pr = 58; addBumper(L,f,60,300,15); addBumper(L,f,300,300,15); }
  else if(type==='modem'){
    B.hp = B.maxhp = 4; B.idx = 1; B.conn = 0; B.jT = 0; B.pkT = 0;
    addSeg(L,f,100,6,100,95,{draw:false}); addSeg(L,f,260,6,260,95,{draw:false}); addSeg(L,f,100,95,260,95,{draw:false});
    addBumper(L,f,60,320,15); addBumper(L,f,300,320,15);
  }
  else if(type==='poly'){ B.hp = B.maxhp = 5; B.hx = 180; B.hy = Y(f,170); B.hr = 40; B.yaw = 0; B.w = .9; B.hvx = 0; B.spT = 0; addBumper(L,f,56,330,15); addBumper(L,f,304,330,15); }
  else if(type==='drone'){ B.hp = B.maxhp = 4; B.state = 'aim'; B.dx = 180; B.dy = Y(f,170); B.dr = 24; B.dvx = 0; B.dvy = 0; addPost(L,f,70,400,7); addPost(L,f,290,400,7); }
  else if(type==='hole'){ B.hp = B.maxhp = 4; B.cx = 180; B.cy = Y(f,210); B.ca = 0; B.cw = 1.2; B.kx = 180; B.ky = Y(f,110); addPost(L,f,60,420,7); addPost(L,f,300,420,7); }
  else if(type==='ai'){ B.hp = B.maxhp = 6; B.ex = 180; B.ey = Y(f,150); B.er = 32; B.ring = 72; B.rot = 0; B.rw = .7; B.state = 'open'; B.plates = Array(10).fill(true); B.lzT = 0; addBumper(L,f,56,330,15); addBumper(L,f,304,330,15); }
}
function moversE45(B, h){
  if(B.dead) return;
  if(B.type==='poly'){ B.ph2 = (B.ph2||0) + h*.5; B.hx = 180 + Math.sin(B.ph2)*60; B.hvx = Math.cos(B.ph2)*.5*60; B.yaw += B.w*h; }
  if(B.type==='drone'){ B.ph2 = (B.ph2||0) + h; const ox = B.dx, oy = B.dy; B.dx = 180 + Math.sin(B.ph2*.7)*90; B.dy = Y(B.f,170) + Math.sin(B.ph2*1.3)*30; B.dvx = (B.dx-ox)/h; B.dvy = (B.dy-oy)/h; }
  if(B.type==='hole'){ B.ca += B.cw*h; B.kx = B.cx + Math.cos(B.ca)*100; B.ky = B.cy + Math.sin(B.ca)*100*.8;
    const b = G.ball; if(b && !b.rail && !b.held){ const dx = B.cx-b.x, dy = B.cy-b.y, d = Math.hypot(dx,dy);
      if(d < 230 && d > 1){ const a = 1500*(1-d/230); b.vx += dx/d*a*h; b.vy += dy/d*a*h; }
      if(d < 20){ const side = Math.random()<.5 ? -1 : 1; b.x = 180 + side*70; b.y = B.cy + 110; b.vx = side*260; b.vy = 520; popup('ESPAGUETIFICADO!', 180, B.cy+60, HOLO[2], 1.2); SFX.drain(); G.combo.n = 1; } } }
  if(B.type==='ai') B.rot += B.rw*h;
}
function damageE45(B){
  if(B.type==='pet'){ B.state = 'sleep'; B.st = 0; if(B.calls < 3 && B.hp > 0){ B.calls++; const x = 70 + Math.random()*220; G.L.enemies.push({ type:'hop', f:B.f, alive:true, flash:0, ph:Math.random()*6, r:13, x, by:Y(B.f,430), y:Y(B.f,430), vx:0, vy:0, k:1.2 }); popup('NASCEU UM BICHINHO!', x, Y(B.f,400), RAVE[0], 1.2); } }
  if(B.type==='modem'){ B.conn = .6; B.jT = 0; spitDiscs(B, 180, Y(B.f,110)); spitDiscs(B, 180, Y(B.f,110)); }
  if(B.type==='poly'){ B.w += .3; spitDiscs(B, B.hx, B.hy+30); }
  if(B.type==='drone'){ B.state = 'aim'; B.st = 0; }
  if(B.type==='hole'){ B.cw += .35; B.ca += Math.PI; }
  if(B.type==='ai'){ B.plates.fill(true); B.rw += .25; B.state = 'closed'; B.st = 0; const b = G.ball, dx = b.x-B.ex, dy = b.y-B.ey, d = Math.hypot(dx,dy)||1; b.vx += dx/d*500; b.vy += dy/d*500; }
  if(B.hp <= 0){ B.discs.length = 0; B.sparks.length = 0; }
}
function updateE45(B, dt, b){
  if(B.type==='pet'){
    if(B.state==='sleep' && B.st > 3.2 - (4-B.hp)*.4){ B.state = 'awake'; B.st = 0; Snd.tone(1760, .08, 'square', .04); Snd.tone(1320, .08, 'square', .04, 0, .1); }
    else if(B.state==='awake' && B.st > 2){ B.state = 'sleep'; B.st = 0; }
  } else if(B.type==='modem'){
    if(B.conn > 0){ B.conn -= dt; if(B.conn <= 0){ let n = B.idx; while(n===B.idx) n = Math.floor(Math.random()*3); B.idx = n; } }
    B.jT += dt; if(B.jT > 2.6 - (4-B.hp)*.3){ B.jT = 0; B.conn = .5; Snd.noise(.4, .05, 0, 300, 0, { bp:1800, sweep:900, q:4 }); }
    B.pkT += dt; if(B.pkT > 3.2){ B.pkT = 0; spitDiscs(B, 180, Y(B.f,110)); }
    moveDiscs(B, dt);
  } else if(B.type==='poly'){
    B.spT += dt; if(B.spT > 4){ B.spT = 0; spitDiscs(B, B.hx, B.hy+30); }
    moveDiscs(B, dt);
  } else if(B.type==='drone'){
    if(B.state==='aim' && B.st > 2.4 - (4-B.hp)*.3){ B.state = 'vent'; B.st = 0; fireAtFlippers(B, B.hp<=2 ? 2 : 1, B.dx, B.dy+20, 260+(4-B.hp)*40); }
    else if(B.state==='vent' && B.st > 1.6){ B.state = 'aim'; B.st = 0; }
    sparkStep(B, dt, b, HOLO[0], 'SOBRECARGA!', 1.4);
  } else if(B.type==='ai'){
    if(B.state==='open' && B.st > 2.6){ B.state = 'closed'; B.st = 0; }
    else if(B.state==='closed' && B.st > 1.2){ B.state = 'open'; B.st = 0; }
    B.lzT += dt; if(B.lzT > 4 - (6-B.hp)*.35){ B.lzT = 0; fireAtFlippers(B, B.hp<=3 ? 2 : 1, B.ex, B.ey+B.er, 250+(6-B.hp)*35); }
    sparkStep(B, dt, b, HOLO[2], 'SOBRECARGA!', 1.5);
  }
}
function collideE45(B, b){
  const hitBody = (x, y, r, vx, vy, vuln, need) => { const imp = hitMoving(b, x, y, r, vx, vy, .55); if(imp > 0){ const dx = b.x-x, dy = b.y-y, d = Math.hypot(dx,dy)||1; b.vx += dx/d*240; b.vy += dy/d*240; if(vuln && imp > need && B.hitCool <= 0 && B.intro) bossDamage(B, x, y); else SFX.relay(); } };
  if(B.type==='pet') hitBody(B.px, B.py, B.pr, 0, 0, B.state==='awake', 280);
  else if(B.type==='modem'){ const sx = [110,180,250][B.idx]; hitBody(sx, Y(B.f,140), 14, 0, 0, !(B.conn > 0), 240); discCollide(B, b); }
  else if(B.type==='poly'){ hitBody(B.hx, B.hy, B.hr, B.hvx, 0, Math.cos(B.yaw) > .55, 300); discCollide(B, b); }
  else if(B.type==='drone') hitBody(B.dx, B.dy, B.dr, B.dvx, B.dvy, B.state==='vent', 280);
  else if(B.type==='hole'){ const vx = -Math.sin(B.ca)*100*B.cw, vy = Math.cos(B.ca)*80*B.cw; hitBody(B.kx, B.ky, 13, vx, vy, true, 220); }
  else if(B.type==='ai'){
    hitBody(B.ex, B.ey, B.er, 0, 0, B.state==='open', 300);
    for(let k=0;k<10;k++){ if(!B.plates[k]) continue; const a = B.rot + k/10*TAU, px = B.ex + Math.cos(a)*B.ring, py = B.ey + Math.sin(a)*B.ring;
      const im = hitMoving(b, px, py, 11, -Math.sin(a)*B.ring*B.rw, Math.cos(a)*B.ring*B.rw, .5); if(im > 150){ B.plates[k] = false; addScore(100, px, py); sparks(px, py, HOLO[0], 10); Snd.tone(1500, .06, 'square', .04, 600); } else if(im > 0) SFX.relay(); }
  }
}

/* ---------- art: floors ---------- */
function drawFloorArtE4(x, L, f){
  const hue = f/(Math.max(1,L.n-1));
  x.fillStyle = lin(x,0,0,0,FH,[`hsl(${184-hue*10},36%,${30+hue*3}%)`,`hsl(${200-hue*8},32%,22%)`,'#162a34']); x.fillRect(0,0,W,FH);
  // 90s paper-cup brush swooshes
  const sw = (cx, cy, len, ang, col, wdt) => { x.save(); x.translate(cx, cy); x.rotate(ang); x.strokeStyle = col; x.lineCap = 'round';
    for(let k=0;k<7;k++){ x.lineWidth = wdt*(.25+.1*(k%3)); x.globalAlpha = .1 + (k%2)*.05; x.beginPath(); x.moveTo(-len/2, (k-3)*wdt*.16); x.bezierCurveTo(-len/6, -wdt*.9+(k-3)*wdt*.16, len/6, wdt*.9+(k-3)*wdt*.16, len/2, (k-3)*wdt*.14); x.stroke(); } x.restore(); };
  sw(120, 140, 220, -.35, '#b45af0', 26); sw(250, 520, 240, -.2, '#20c8b8', 24); sw(80, 430, 160, .5, '#b45af0', 16);

function dailyInfo(){
